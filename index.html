function fraccionConcesionNegociacion(medidor){
  if(medidor >= 70) return 0.85;
  if(medidor >= 50) return 0.55;
  if(medidor >= 30) return 0.25;
  return 0.05;
}
function costeParaClubNegociacion(propuesta, j, listaObjetivos){
  listaObjetivos = listaObjetivos || OBJETIVOS_NEGOCIACION;
  const costeSueldo = propuesta.sueldoDelta * 45;
  const factorEdad = j.edad <= 29 ? -5 : 7;
  const costeDuracion = propuesta.duracionDelta * factorEdad;
  const opcion = listaObjetivos.find(o=>o.id===propuesta.objetivo);
  const costeObjetivo = opcion ? opcion.coste : 0;
  return costeSueldo + costeDuracion + costeObjetivo;
}
function opcionesNegociacionDisponibles(neg, j, listaObjetivos){
  listaObjetivos = listaObjetivos || OBJETIVOS_NEGOCIACION;
  return listaObjetivos.filter(o=>{
    if(neg.objetivosConseguidos.includes(o.id)) return false;
    if(o.soloSiNoEsLaLiga && neg.club && neg.club.categoria === 'LaLiga') return false;
    return true;
  });
}
function iniciarPropuestaNegociacion(){
  S.negociacion.propuesta = { sueldoDelta:0, duracionDelta:0, objetivo:null };
}
function enviarPropuestaNegociacion(){
  const neg = S.negociacion;
  const j = S.jugador;
  const p = neg.propuesta;
  if(p.sueldoDelta===0 && p.duracionDelta===0 && !p.objetivo) return;

  const coste = costeParaClubNegociacion(p, j);
  let efectoMedidor = Math.round(-coste * 0.9);
  let fracForzada = null;
  if(neg.avalListo){
    fracForzada = 1;
    neg.avalListo = false;
  }
  neg.medidor = Math.max(0, Math.min(100, neg.medidor + efectoMedidor));
  const frac = fracForzada != null ? fracForzada : fraccionConcesionNegociacion(neg.medidor);

  const partes = [];
  const sueldoInicioTurno = neg.sueldo;

  if(p.sueldoDelta !== 0){
    const objetivo = Math.round(neg.sueldo * (1+p.sueldoDelta) / 50) * 50;
    const costeSueldo = p.sueldoDelta * 45;
    const fracSueldo = costeSueldo <= 0 ? 1 : frac;
    const nuevoSueldo = Math.round((neg.sueldo + (objetivo - neg.sueldo) * fracSueldo) / 50) * 50;
    if(costeSueldo <= 0){
      partes.push(`Ofreces bajar a ${formatearDinero(objetivo)}, y lo aceptan encantados.`);
    } else if(fracSueldo >= 0.8){
      partes.push(`Pides ${formatearDinero(objetivo)} y casi lo aceptan entero.`);
    } else if(fracSueldo >= 0.4){
      partes.push(`Pides ${formatearDinero(objetivo)} pero solo se acercan hasta la mitad.`);
    } else {
      partes.push(`Pides ${formatearDinero(objetivo)} pero apenas se mueven de su cifra.`);
    }
    neg.sueldo = nuevoSueldo;
  }

  if(p.duracionDelta !== 0){
    const costeDuracion = p.duracionDelta * (j.edad <= 29 ? -5 : 7);
    const fracDuracion = costeDuracion <= 0 ? 1 : frac;
    if(neg.duracion + p.duracionDelta >= 1 && neg.duracion + p.duracionDelta <= 5 && Math.random() < fracDuracion){
      neg.duracion += p.duracionDelta;
      partes.push(p.duracionDelta > 0 ? 'Aceptan alargar el contrato sin problema.' : 'Aceptan acortar el contrato sin problema.');
    } else {
      partes.push('Prefieren no tocar la duración por ahora.');
    }
  }

  if(p.objetivo){
    const opcion = OBJETIVOS_NEGOCIACION.find(o=>o.id===p.objetivo);
    const etiqueta = typeof opcion.label === 'function' ? opcion.label(sueldoInicioTurno) : opcion.label;
    const hayTextoPrevio = partes.length > 0;
    if(Math.random() < frac){
      neg.objetivosConseguidos.push(opcion.id);
      neg.objetivosMonto = neg.objetivosMonto || {};
      if(opcion.monto) neg.objetivosMonto[opcion.id] = opcion.monto(sueldoInicioTurno);
      partes.push(hayTextoPrevio ? `Y aceptan incluir: ${etiqueta}.` : `Aceptan incluir: ${etiqueta}.`);
    } else {
      partes.push(hayTextoPrevio ? `Y no están dispuestos a incluir "${etiqueta}" todavía.` : `No están dispuestos a incluir "${etiqueta}" todavía.`);
    }
  }

  neg.log = partes.join(' ');
  neg.turno++;
  iniciarPropuestaNegociacion();

  if(neg.medidor <= 12){
    neg.terminado = 'roto';
  } else if(neg.turno >= neg.maxTurnos){
    // Se agotan las propuestas, pero no se fuerza el fracaso: el club deja su última
    // oferta sobre la mesa y tú decides si la aceptas o te levantas.
    neg.sinMasPropuestas = true;
  }
}
function cerrarTratoNegociacion(){
  const neg = S.negociacion;
  const j = S.jugador;
  if(neg.esRenovacion){
    j.contrato = { sueldoAnual: neg.sueldo, duracionTemporadas: neg.duracion, duracionOriginal: neg.duracion };
    aplicarPromesasNegociacion(j, neg);
    S.negociacion = null;
    S.ofertasActuales = [];
    iniciarTemporadaJuego(j);
    return true;
  }
  aplicarPromesasNegociacion(j, neg);
  iniciarFichaje(j, neg.club, { sueldoAnual: neg.sueldo, duracionTemporadas: neg.duracion }, neg.siguientePantalla || 'iniciarTemporada');
  S.negociacion = null;
  return true;
}
function pctClausulaQuePagaElClub(club){
  if(!club) return 0;
  if(club.grande) return 1; // los dos grandes históricos la asumen entera
  const prestigio = PRESTIGIO_CLUB[club.nombre] || 2;
  if(prestigio >= 4) return 1;
  if(prestigio === 3) return 0.5;
  return 0;
}
function confirmarClausulaYFichar(){
  const neg = S.negociacion;
  const j = S.jugador;
  const añosRestantes = j.contrato.duracionTemporadas;
  const pctPenalizacion = beneficioRepresentante(j).penalizacionClausula;
  const costeRescision = Math.round(j.contrato.sueldoAnual * añosRestantes * (1 + pctPenalizacion));
  const pctClub = pctClausulaQuePagaElClub(neg.club);
  const costeQuePagasTu = Math.round(costeRescision * (1 - pctClub));
  j.stats.dinero -= costeQuePagasTu;
  j.carinoAficion = Math.max(0, (j.carinoAficion||0) - 20); // la afición no olvida que te fuiste con contrato en vigor
  j.stats.reputacion = Math.max(0, j.stats.reputacion - 3);
  cerrarTratoNegociacion();
  return true;
}
function aplicarPromesasNegociacion(j, neg){
  if(!neg.objetivosConseguidos.length) return;
  j.promesasActivas = j.promesasActivas || [];
  neg.objetivosConseguidos.forEach(id=>{
    const opcion = OBJETIVOS_NEGOCIACION.find(o=>o.id===id);
    const monto = (neg.objetivosMonto||{})[id];
    const promesa = { id: opcion.id, texto: (typeof opcion.label === 'function' ? opcion.label(neg.sueldo) : opcion.label), tipo: opcion.tipo, plazoTemporadas:1, origen:'club', temporadaLimite: S.temporada };
    if(opcion.tipo === 'prima_gol') promesa.montoUnitario = monto;
    else if(opcion.tipo !== 'titular') promesa.montoFijo = monto;
    j.promesasActivas.push(promesa);
  });
}
function beneficioRepresentante(j){
  if(!j.representante) return { medidorBonus:0, penalizacionClausula:0.20 };
  const c = j.representante.comision;
  if(c <= 0.04) return { medidorBonus:5, penalizacionClausula:0.17 };
  if(c <= 0.08) return { medidorBonus:10, penalizacionClausula:0.14 };
  return { medidorBonus:15, penalizacionClausula:0.10 };
}

    c.appendChild(box);
    c.appendChild(el('div','event-text', desc));

    if(neg.terminado === 'acuerdo'){
      const añosRestantes = (!neg.esRenovacion && j.contrato && !j.contrato.emergencia) ? j.contrato.duracionTemporadas : 0;
      if(añosRestantes > 0){

        const pctPenalizacion = beneficioRepresentante(j).penalizacionClausula;
        const costeRescision = Math.round(sueldoPendiente * (1 + pctPenalizacion));
        const pctClub = pctClausulaQuePagaElClub(neg.club);

function enviarPropuestaPatrocinio(){
  const neg = S.negociacionPatrocinio;
  const j = S.jugador;
  const p = neg.propuesta;
  if(p.sueldoDelta===0 && p.duracionDelta===0 && !p.objetivo) return;

  const coste = costeParaClubNegociacion(p, j, OBJETIVOS_NEGOCIACION_PATROCINIO);
  const efectoMedidor = Math.round(-coste * 0.9);
  neg.medidor = Math.max(0, Math.min(100, neg.medidor + efectoMedidor));
  const frac = fraccionConcesionNegociacion(neg.medidor);

  const partes = [];
  const dineroInicioTurno = neg.dinero;

  if(p.sueldoDelta !== 0){
    const objetivo = Math.round(neg.dinero * (1+p.sueldoDelta) / 50) * 50;
    const costeSueldo = p.sueldoDelta * 45;
    const fracSueldo = costeSueldo <= 0 ? 1 : frac;
    const nuevoDinero = Math.max(200, Math.round((neg.dinero + (objetivo - neg.dinero) * fracSueldo) / 50) * 50);
    if(costeSueldo <= 0){
      partes.push(`Ofreces bajar a ${formatearDinero(objetivo)}, y lo aceptan encantados.`);
    } else if(fracSueldo >= 0.8){
      partes.push(`Pides ${formatearDinero(objetivo)} y casi lo aceptan entero.`);
    } else if(fracSueldo >= 0.4){
      partes.push(`Pides ${formatearDinero(objetivo)} pero solo se acercan hasta la mitad.`);
    } else {
      partes.push(`Pides ${formatearDinero(objetivo)} pero apenas se mueven de su cifra.`);
    }
    neg.dinero = nuevoDinero;
  }

  if(p.duracionDelta !== 0){
    const costeDuracion = p.duracionDelta * (j.edad <= 29 ? -5 : 7);
    const fracDuracion = costeDuracion <= 0 ? 1 : frac;
    if(neg.duracion + p.duracionDelta >= 1 && neg.duracion + p.duracionDelta <= 4 && Math.random() < fracDuracion){
      neg.duracion += p.duracionDelta;
      partes.push(p.duracionDelta > 0 ? 'Aceptan alargar el contrato de imagen sin problema.' : 'Aceptan acortarlo sin problema.');
    } else {
      partes.push('Prefieren no tocar la duración por ahora.');
    }
  }

  if(p.objetivo){
    const opcion = OBJETIVOS_NEGOCIACION_PATROCINIO.find(o=>o.id===p.objetivo);
    const etiqueta = typeof opcion.label === 'function' ? opcion.label(dineroInicioTurno) : opcion.label;
    const hayTextoPrevio = partes.length > 0;
    if(Math.random() < frac){
      neg.objetivosConseguidos.push(opcion.id);
      neg.objetivosMonto = neg.objetivosMonto || {};
      if(opcion.monto) neg.objetivosMonto[opcion.id] = opcion.monto(dineroInicioTurno);
      partes.push(hayTextoPrevio ? `Y aceptan incluir: ${etiqueta}.` : `Aceptan incluir: ${etiqueta}.`);
    } else {
      partes.push(hayTextoPrevio ? `Y no están dispuestos a incluir "${etiqueta}" todavía.` : `No están dispuestos a incluir "${etiqueta}" todavía.`);
    }
  }

  neg.log = partes.join(' ');
  neg.turno++;
  neg.propuesta = { sueldoDelta:0, duracionDelta:0, objetivo:null };

  if(neg.medidor <= 12){
    neg.terminado = 'roto';
  } else if(neg.turno >= neg.maxTurnos){
    // Se agotan las propuestas: el club deja su última oferta y tú decides.
    neg.sinMasPropuestas = true;
  }
}
function aplicarPromesasPatrocinio(j, neg){
  if(!neg.objetivosConseguidos.length) return;
  j.promesasActivas = j.promesasActivas || [];
  neg.objetivosConseguidos.forEach(id=>{
    if(id === 'exclusividad') return; // cláusula de efecto inmediato, no necesita evaluarse a fin de temporada
    const opcion = OBJETIVOS_NEGOCIACION_PATROCINIO.find(o=>o.id===id);
    const monto = (neg.objetivosMonto||{})[id];
    const promesa = { id: opcion.id, texto: (typeof opcion.label === 'function' ? opcion.label(neg.dinero) : opcion.label), tipo: opcion.tipo, plazoTemporadas:1, origen:'marca', temporadaLimite: S.temporada };
    if(monto) promesa.montoFijo = monto;
    if(opcion.tipo === 'prima_popularidad'){
      const siguienteNivel = NIVELES_POPULARIDAD.find(n => n.min > (j.stats.popularidad||0)) || NIVELES_POPULARIDAD[NIVELES_POPULARIDAD.length-1];
      promesa.umbralPopularidad = siguienteNivel.min;
    }
    j.promesasActivas.push(promesa);
  });
}
function cerrarTratoPatrocinio(){
  const neg = S.negociacionPatrocinio;
  const j = S.jugador;
  j.patrocinio = { marca: neg.marca, colores: neg.colores, cantidadAnual: neg.dinero, duracionTemporadas: neg.duracion };
  aplicarPromesasPatrocinio(j, neg);
  S.negociacionPatrocinio = null;
  avanzarPaso(j);
}

function renderizarServiciosProfesionales(j, contenedor){
  contenedor.appendChild(el('div','stat-section-titulo','SERVICIOS PROFESIONALES'));
  const categorias = {};
  TIENDA_SERVICIOS.forEach(s=>{
    categorias[s.categoria] = categorias[s.categoria] || [];
    categorias[s.categoria].push(s);
  });
  Object.entries(categorias).forEach(([nombreCategoria, servicios])=>{
    const tituloCategoria = document.createElement('div');
    tituloCategoria.style.cssText = "font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ink-soft);text-transform:uppercase;margin:14px 0 8px;";
    tituloCategoria.textContent = nombreCategoria;
    contenedor.appendChild(tituloCategoria);
    servicios.forEach(servicio=>{
    if(servicio.esPorcentaje && !j.suscripciones[servicio.familia] && j.representante){
      // sincronizar con un representante conseguido por evento narrativo, para reflejarlo aquí
      const cercano = servicio.niveles.reduce((mejor,n)=> Math.abs(n.comisionPct-j.representante.comision) < Math.abs(mejor.comisionPct-j.representante.comision) ? n : mejor);
      j.suscripciones[servicio.familia] = cercano.nivel;
    }
    const nivelActual = j.suscripciones[servicio.familia] || 0;
    const fila = el('div','servicio-fila');
    const cab = el('div','servicio-cab');
    const efectoBase = (servicio.niveles[0] || {}).efectoTemporada || {};
    const mejoraTxt = Object.keys(efectoBase).map(k => NICE_ATTR[k] || NICE_STAT[k] || k).join(' · ');
    const mejoraSpan = mejoraTxt ? ` <span class="servicio-mejora" style="font-weight:400;font-size:11px;color:var(--gold);white-space:nowrap;">↑ ${mejoraTxt}</span>` : '';
    cab.innerHTML = `${iconoInsignia(servicio.icono,26)}<span class="servicio-nombre">${servicio.nombre}</span>${mejoraSpan}${nivelActual>0?'<span class="servicio-activo-tag">ACTIVO</span>':''}`;
    fila.appendChild(cab);
    const niveles = el('div','servicio-niveles');
    servicio.niveles.forEach(info=>{
      const activo = nivelActual === info.nivel;
      const desbloqueado = !info.desbloqueo || info.desbloqueo(j);
      const asequible = !desbloqueado || activo || puedePagarServicio(j, servicio.familia, info.nivel);
      const btn = el('div','servicio-nivel-btn'+(activo?' activo':'')+(!desbloqueado||!asequible?' inasequible':''));
      const etiquetaCoste = servicio.esPorcentaje ? `${Math.round(info.comisionPct*100)}% del sueldo` : `${formatearDinero(info.costeAnual)}/año`;
      btn.innerHTML = `<div class="n">Nivel ${info.nivel}</div><div class="c">${etiquetaCoste}</div>`;
      if(!desbloqueado){
        btn.title = info.etiquetaBloqueo || 'Todavía no disponible';
      } else if(!asequible){
        btn.title = (j.stats.dinero||0) < 0
          ? 'No puedes activar ni subir de nivel servicios mientras tu cuenta esté en números rojos'
          : 'Ni con tus ahorros puedes cubrir el déficit que dejaría este compromiso durante la temporada';
      }
      if(desbloqueado && asequible){
        btn.onclick = ()=>{
          const nuevoNivel = activo ? 0 : info.nivel;
          j.suscripciones[servicio.familia] = nuevoNivel;
          if(servicio.esPorcentaje){
            j.representante = nuevoNivel ? { comision: info.comisionPct, nombre: (j.representante && j.representante.nombre) || elegirAgenciaRepresentacion(), agente: (j.representante && j.representante.agente) || generarNombreAgente() } : null;
          }
          pintar();
        };
      }
      niveles.appendChild(btn);
    });
    fila.appendChild(niveles);
    const primerBloqueado = servicio.niveles.find(n => n.desbloqueo && !n.desbloqueo(j));
    if(primerBloqueado && !nivelActual){
      fila.appendChild(el('div','servicio-desc', `🔒 Nivel ${primerBloqueado.nivel}: ${primerBloqueado.etiquetaBloqueo}`));
    } else {
      const infoDesc = servicio.niveles.find(n=>n.nivel === (nivelActual || 1));
      fila.appendChild(el('div','servicio-desc', infoDesc.desc));
    }
    contenedor.appendChild(fila);
    });
  });
}
function renderizarCoches(j, contenedor){
  contenedor.appendChild(el('div','stat-section-titulo','GARAJE'));
  const fila = el('div','servicio-fila');
  const cab = el('div','servicio-cab');
  const nombreActual = j.cocheActual > 0 ? TIENDA_COCHES.find(c=>c.nivel===j.cocheActual).nombre : null;
  cab.innerHTML = `${iconoInsignia('dinero',26)}<span class="servicio-nombre">Coche</span>${nombreActual?`<span class="servicio-activo-tag">${nombreActual.toUpperCase()}</span>`:''}`;
  fila.appendChild(cab);
  const niveles = el('div','servicio-niveles');
  TIENDA_COCHES.forEach(info=>{
    const yaComprado = j.cocheActual === info.nivel;
    const esInferior = j.cocheActual > info.nivel;
    const desbloqueado = !info.desbloqueo || info.desbloqueo(j);
    const puedePagar = (j.stats.dinero||0) >= info.coste && (j.stats.dinero||0) >= 0;
    const asequible = !desbloqueado || yaComprado || esInferior || puedePagar;
    const btn = el('div','servicio-nivel-btn'+(yaComprado?' activo':'')+(!desbloqueado||!asequible||esInferior?' inasequible':''));
    btn.innerHTML = `<div class="n">${info.nombre}</div><div class="c">${formatearDinero(info.coste)}</div>`;
    if(!desbloqueado){
      btn.title = info.etiquetaBloqueo || 'Todavía no disponible';
    } else if(esInferior){
      btn.title = 'Ya tienes un coche mejor que este';
    } else if(!asequible && !yaComprado){
      btn.title = (j.stats.dinero||0) < 0
        ? 'No puedes comprar nada mientras tu cuenta esté en números rojos'
        : `Te falta dinero para permitirte este coche (${formatearDinero(info.coste)})`;
    }
    if(desbloqueado && asequible && !yaComprado && !esInferior){
      btn.onclick = ()=>{
        aplicarEfectos(j, { dinero:-info.coste, ...info.efecto });
        j.cocheActual = info.nivel;
        pintar();
      };
    }
    niveles.appendChild(btn);
  });
  fila.appendChild(niveles);
  const primerBloqueado = TIENDA_COCHES.find(n => n.desbloqueo && !n.desbloqueo(j));
  if(primerBloqueado && !j.cocheActual){
    fila.appendChild(el('div','servicio-desc', `🔒 ${primerBloqueado.nombre}: ${primerBloqueado.etiquetaBloqueo}`));
  } else {
    const infoDesc = TIENDA_COCHES.find(n=>n.nivel === (j.cocheActual || 1));
    fila.appendChild(el('div','servicio-desc', infoDesc.desc));
  }
  contenedor.appendChild(fila);
}
function renderizarTienda(j, contenedor){
  renderizarServiciosProfesionales(j, contenedor);
  renderizarCoches(j, contenedor);
}

SCREENS.evento = function(){
  topbar("Suceso de la semana");
  const j = S.jugador;
  const ev = S.eventoActual;
  const c = el('div','card');
  c.appendChild(crearEyebrow('Decisión'));
  const vecesVisto = j.eventosVistos.filter(v=>v.id===ev.id).length;
  const textoMostrado = (vecesVisto > 1 && ev.variantes && ev.variantes.length)
    ? resolverTexto(ev.variantes[Math.floor(Math.random()*ev.variantes.length)], j)
    : resolverTexto(ev.texto, j);
  c.appendChild(el('div','event-text', textoMostrado));

  let respondiendo = false; // evita que un doble toque resuelva el mismo suceso dos veces (260ms de transición)
  ev.opciones.forEach(op=>{
    const b = el('div','opt');
    b.appendChild(document.createTextNode(op.texto));
    const costeDinero = (op.efectos && op.efectos.dinero < 0) ? Math.abs(op.efectos.dinero) : (typeof op.costeEstimado === 'function' ? op.costeEstimado(j) : 0);
    const noPuedePagar = costeDinero > 0 && j.stats.dinero < costeDinero;
    if(noPuedePagar){
      b.appendChild(el('span','tag-pill risk', `💸 No puedes permitírtelo (te faltan ${formatearDinero(costeDinero - j.stats.dinero)})`));
    }
    if(op.tirada){
      const p = probabilidadExito(j, op.tirada);
      const tag = el('span','tag');
      tag.appendChild(el('span','tag-pill', `🎲 Dificultad ${p.dificultad}`));
      tag.appendChild(el('span','tag-pill', `${NICE_ATTR[op.tirada.atributo]} +${p.bonoAtributo}`));
      p.mods.forEach(m=> tag.appendChild(el('span','tag-pill', m)) );
      tag.appendChild(el('span','tag-pill pct', etiquetaProbabilidad(p.pct)));
      b.appendChild(tag);
    }
    b.onclick = ()=>{
      if(respondiendo) return;
      respondiendo = true;
      if(noPuedePagar){
        const cambios = aplicarEfectos(j, { dinero:-j.stats.dinero, reputacion:-4, mental:-3 });
        j.historial.push({ temporada:S.temporada, evento: ev.id||'relleno' });
        S.resultadoEvento = { roll:null, rama:{ texto:'No te llega el dinero para esto. Acabas gastando hasta el último euro que tenías y quedas en evidencia.', efectos:{ dinero:-j.stats.dinero, reputacion:-4, mental:-3 } }, cambios };
        S.screen = 'resultado';
      } else if(op.tirada){
        const r = tirar(j, op.tirada);
        S.pendingRoll = { j, ev, op, r };
        S.screen = 'tirando';
      } else {
        const efectosReales = op.efectosFn ? op.efectosFn(j) : op.efectos;
        const cambios = aplicarEfectos(j, efectosReales);
        if(op.patrocinioFn) j.patrocinio = op.patrocinioFn(j);
        if(op.contratarRepresentante) j.representante = crearRepresentante(0.06);
        if(op.filialInicio) j.enFilial = true;
        if(op.filialFin) j.enFilial = false;
        if(op.parejaInicio){ j.tienePareja = true; j.stats.felicidadPareja = 60; j.pareja = generarNombrePareja(); }
        if(op.parejaFin){ j.tienePareja = false; j.stats.felicidadPareja = 0; j.pareja = null; }
        const cambioDeClub = procesarBanderasFichaje(j, { fichaje:op.fichaje, fichajeExtranjero:op.fichajeExtranjero, fichajeUltimaEtapa:op.fichajeUltimaEtapa, fichajeGrande:op.fichajeGrande, diferirVerano:op.diferirVerano });
        j.historial.push({ temporada:S.temporada, evento: ev.id||'relleno' });
        S.resultadoEvento = { roll:null, rama:{ texto: resolverTexto(op.resultado, j) || null, efectos:efectosReales, fichajeGrande: op.fichajeGrande||false, fichajeUltimaEtapa: op.fichajeUltimaEtapa||false, fichajeExtranjero: op.fichajeExtranjero||false, diferirVerano: op.diferirVerano||false }, cambios };
        S.pendienteNegociacionFichaje = cambioDeClub;
        S.screen = 'resultado';
      }
      render();
    };
    c.appendChild(b);

    if(op.tirada && j.objetos.inspiracion>0){
      const tokenBtn = document.createElement('div');
      tokenBtn.className = 'opt-token-icono';
      tokenBtn.title = `Usar Golpe de Inspiración (+4) · te quedan ${j.objetos.inspiracion}`;
      tokenBtn.innerHTML = ICONOS_SVG.inspiracion;
      tokenBtn.onclick = (e)=>{
        e.stopPropagation();
        if(respondiendo) return;
        respondiendo = true;
        j.objetos.inspiracion--;
        const r = tirar(j, op.tirada, 4);
        S.pendingRoll = { j, ev, op, r, conToken:'inspiracion' };
        S.screen = 'tirando';
        render();
      };
      b.appendChild(tokenBtn);
    } else if(op.tirada && j.objetos.vestuario>0){
      const tokenBtn2 = document.createElement('div');
      tokenBtn2.className = 'opt-token-icono vestuario';
      tokenBtn2.title = `Usar Palabras del vestuario (+2) · te quedan ${j.objetos.vestuario}`;
      tokenBtn2.innerHTML = ICONOS_SVG.vestuario;
      tokenBtn2.onclick = (e)=>{
        e.stopPropagation();
        if(respondiendo) return;
        respondiendo = true;
        j.objetos.vestuario--;
        const r = tirar(j, op.tirada, 2);
        S.pendingRoll = { j, ev, op, r, conToken:'vestuario' };
        S.screen = 'tirando';
        render();
      };
      b.appendChild(tokenBtn2);
    }
  });
  app.appendChild(c);
};

SCREENS.tirando = function(){
  topbar("Tirando los dados…");
  const { j, ev, op, r, conToken, esPrologo } = S.pendingRoll;
  if(!esPrologo){
  }
  const c = el('div','card');
  const scene = el('div','dice-scene');
  scene.appendChild(el('div','dice-need', `Necesitas un total de <b>${r.dificultad}</b> o más`));
  const die = el('div','die', '?');
  scene.appendChild(die);
  const sumaLbl = el('div','dice-suma', '');
  scene.appendChild(sumaLbl);
  const textoConToken = conToken==='inspiracion' ? ' (con Golpe de Inspiración)' : (conToken==='vestuario' ? ' (con Palabras del vestuario)' : '');
  const captionTirada = `1d20 + ${r.bono} de ${NICE_ATTR[op.tirada.atributo]}${textoConToken}${r.dadoDescartado!==null?' (con Segunda Oportunidad, 2 dados)':''}`;
  scene.appendChild(el('div','dice-caption', captionTirada));
  const resultLbl = el('div','roll-result', r.exito ? 'ÉXITO' : 'FALLO');
  resultLbl.classList.add(r.exito ? 'exito' : 'fallo');
  scene.appendChild(resultLbl);
  c.appendChild(scene);
  app.appendChild(c);

  let ticks = 0;
  const maxTicks = 18;
  function tick(){
    ticks++;
    die.textContent = 1 + Math.floor(Math.random()*20);
    die.style.transform = `rotate(${(Math.random()*40-20).toFixed(0)}deg)`;
    Sonido.tick();
    if(ticks >= maxTicks){
      die.textContent = r.dado;
      die.style.transform = 'rotate(0deg)';
      die.classList.add('settled');
      if(r.natural20) die.classList.add('natural');
      if(r.natural1) die.classList.add('maldeojo');
      Sonido.tick();
      setTimeout(()=>{
        sumaLbl.textContent = `${r.dado} ${r.bono>=0?'+':'-'} ${Math.abs(r.bono)} = ${r.total}`;
        sumaLbl.classList.add('show');
      }, 450);
      setTimeout(()=>{
        resultLbl.classList.add('show');
        j.stats.confianza = Math.max(0, Math.min(100, j.stats.confianza + (r.exito ? 3 : -3)));
        if(r.natural1) j.rachaGafada = true;
        if(r.exito) Sonido.exito(); else Sonido.fallo();
      }, 1050);
      setTimeout(()=>{
        const procederResolucion = ()=>{
          if(S.pendingRoll.esSemifinal){
            const tipo = S.pendingRoll.tipoSemifinal;
            if(r.exito){
              aplicarEfectos(j, S.pendingRoll.masMerito ? {forma:6,confianza:5,reputacion:3} : {forma:2,confianza:2});
              if(r.natural20) S.ventajaFinalNatural20 = true;
              if(tipo !== 'playoff' && S.torneoActual && S.torneoActual.rivalFinalPendiente) S.torneoActual.rival = S.torneoActual.rivalFinalPendiente;
              S.screen = tipo === 'playoff' ? 'playoffFinalIntro' : 'torneoFinalIntro';
              if(tipo === 'playoff') S.playoffResultadoTexto = op.exito.texto;
            } else {
              Sonido.fallo();
              aplicarEfectos(j, {forma:-6});
              if(tipo === 'playoff'){
                S.playoffResultadoTexto = op.fallo.texto;
                S.screen = 'playoffEliminado';
              } else {
                const cfg = S.torneoActual;
                S.faseCompeticiones = S.faseCompeticiones || {};
                S.faseCompeticiones[cfg.nombreCompeticion] = 'Semifinales';
                S.torneoEliminadoTexto = (cfg.tipo === 'seleccion' || cfg.tipo === 'seleccion_sub21')
                  ? `La selección cae eliminada en semifinales contra ${cfg.rival.nombre}. Toca digerir la decepción y volver a intentarlo en el próximo torneo.`
                  : `El equipo cae eliminado en semifinales ante ${articuloClub(cfg.rival.nombre)} ${cfg.rival.nombre}. La aventura en la ${cfg.nombreCompeticion} termina antes de lo esperado.`;
                S.screen = 'torneoEliminado';
              }
            }
            render();
            return;
          }
          if(S.pendingRoll.esNegociacion){
            const neg = S.negociacion;
            neg.intentos++;
            if(r.exito){
              if(op.tipoPeticion === 'dinero'){
                neg.sueldo = Math.round(neg.sueldo * 1.15 / 50) * 50;
                neg.ultimoMensaje = "El club acepta mejorar tu sueldo. La negociación avanza a tu favor.";
              } else {
                neg.duracion = Math.min(5, neg.duracion + 1);
                neg.ultimoMensaje = "El club accede a ampliar la duración del contrato.";
              }
              neg.ultimoTipoRechazado = null;
              if(neg.animo === 'molesto') neg.animo = 'neutral';
              if(r.natural20){
                j.objetos.avalNegociacion++;
                neg.ultimoMensaje += " Además, la forma en que lo has planteado impresiona tanto al director deportivo que te da un aval por escrito para el futuro: un 🤝 Aval de Negociación.";
              }
              Sonido.subeNivel();
            } else {
              const repiteRechazo = op.tipoPeticion === neg.ultimoTipoRechazado;
              const yaEnfadado = neg.animo === 'enfadado';
              const escalada = { contento:'neutral', neutral:'molesto', molesto:'enfadado', enfadado:'enfadado' };
              neg.animo = escalada[neg.animo];
              if(repiteRechazo) neg.animo = escalada[neg.animo]; // insistir en lo mismo cuesta un segundo salto de ánimo
              if(op.tipoPeticion === 'dinero'){
                neg.sueldo = Math.max(300, Math.round(neg.sueldo * (repiteRechazo?0.85:0.92) / 50) * 50);
                neg.ultimoMensaje = "El club no solo rechaza la petición: se lo toma a mal y rebaja la oferta sobre la mesa.";
              } else {
                neg.duracion = Math.max(1, neg.duracion - (repiteRechazo?2:1));
                neg.ultimoMensaje = "El club no acepta la petición y, molesto, acorta la duración que estaba dispuesto a ofrecer.";
              }
              neg.ultimoTipoRechazado = op.tipoPeticion;
              if((yaEnfadado || repiteRechazo) && Math.random() < (repiteRechazo?0.6:0.4)){
                neg.rota = true;
                neg.ultimoMensaje = "El club se harta de tus exigencias y retira la oferta sobre la mesa.";
              }
            }
            if(r.natural1) neg.ultimoMensaje += " 😬 Además, algo se ha torcido de mala manera: se te queda cara de mala racha, tu próxima tirada saldrá penalizada.";
            S.screen = 'negociacionFichaje';
            render();
            return;
          }
          const rama = r.exito?op.exito:op.fallo;
          const cambios = aplicarEfectos(j, rama.efectosFn ? rama.efectosFn(j) : rama.efectos);
          if(S.pendingRoll.esPrologo){
            S.prologoResultado = rama.texto;
            S.pruebaPuntos = (S.pruebaPuntos||0) + (r.exito ? (op.puntosExito || 2) : 0);
            S.screen = 'prologoResultado';
            render();
            return;
          }
          let cambioDeClub = false;
          actualizarRachaResultados(j, r);
          cambioDeClub = procesarBanderasFichaje(j, { fichaje:rama.fichaje, fichajeExtranjero:rama.fichajeExtranjero, fichajeUltimaEtapa:rama.fichajeUltimaEtapa, fichajeGrande:rama.fichajeGrande, diferirVerano:rama.diferirVerano });
          let tokenGanado = false;
          if(r.natural20 || rama.token || rama.tokenTipo){
            const tipo = rama.tokenTipo || 'inspiracion';
            j.objetos[tipo]++;
            tokenGanado = tipo;
            mostrarNotificacion(`${iconoInline(tipo,15)}¡Consigues ${(OBJETO_INFO[tipo] && OBJETO_INFO[tipo].nombre) || 'un objeto'}!`, 'objeto');
            S.objetosNuevosSinVer = (S.objetosNuevosSinVer||0) + 1;
          }
          if(rama.contratarRepresentante) j.representante = crearRepresentante(0.06);
          if(rama.filialInicio) j.enFilial = true;
          if(rama.filialFin) j.enFilial = false;
          if(rama.parejaInicio){ j.tienePareja = true; j.stats.felicidadPareja = 60; j.pareja = generarNombrePareja(); }
          if(rama.parejaFin){ j.tienePareja = false; j.stats.felicidadPareja = 0; j.pareja = null; }
          j.historial.push({ temporada:S.temporada, evento: ev.id||'relleno' });
          S.resultadoEvento = { roll:r, rama: { ...rama, texto: resolverTexto(rama.texto, j) }, tokenGanado, cambios };
          S.pendienteNegociacionFichaje = cambioDeClub;
          const tituloTexto = rama.titulo || (rama.tituloFn ? rama.tituloFn(j) : null);
          if(tituloTexto){
            S.esPrimerTitulo = j.carrera.titulos === 0;
            S.ultimoEventoFueTitulo = true;
            S.tituloGanado = tituloTexto;
            S.titulosTemporadaActual = S.titulosTemporadaActual || [];
            S.titulosTemporadaActual.push(tituloTexto);
            S.screen = 'tituloReveal';
          } else {
            S.screen = 'resultado';
          }
          render();
        };
        const puedeSegundaOportunidad = !r.exito && !esPrologo && j.objetos.segundaOportunidad>0 && !S.pendingRoll.usoSegundaOportunidad;
        if(puedeSegundaOportunidad){
          const eleccionBox = el('div','stat-section');
          const btnUsar = document.createElement('div'); btnUsar.className='token-btn';
          btnUsar.textContent = `🍀 Usar Segunda Oportunidad (tira de nuevo, te quedas con el mejor) · te quedan ${j.objetos.segundaOportunidad}`;
          btnUsar.onclick = ()=>{
            j.objetos.segundaOportunidad--;
            const nuevoR = tirar(j, op.tirada, 0, true);
            S.pendingRoll = { ...S.pendingRoll, r: nuevoR, usoSegundaOportunidad: true };
            render();
          };
          eleccionBox.appendChild(btnUsar);
          c.appendChild(eleccionBox);
          const btnAceptar = document.createElement('button'); btnAceptar.className='btn-main';
          btnAceptar.textContent = 'Aceptar el resultado y continuar →';
          btnAceptar.onclick = procederResolucion;
          c.appendChild(btnAceptar);
        } else {
          procederResolucion();
        }
      }, 2700);
      return;
    }
    const progreso = ticks / maxTicks;
    const retraso = 60 + Math.pow(progreso, 3) * 220;
    setTimeout(tick, retraso);
  }
  setTimeout(tick, 60);
};
function fraseEfectos(cambios){
  if(!cambios || cambios.length===0) return 'La decisión no deja consecuencias destacables.';
  const partes = cambios.map(c=>{
    if(c.tipo==='stat'){
      const nombre = NICE_TODO[c.clave] || cap(c.clave);
      return `${nombre} ${c.delta>=0?'sube':'baja'}`;
    }
    const nombre = NICE_ATTR[c.clave] || cap(c.clave);
    return `${nombre} ${c.subio?'mejora':'empeora'}`;
  });
  if(partes.length===0) return 'La decisión no deja consecuencias visibles por ahora, aunque el esfuerzo no se pierde.';
  return `Notas cómo ${partes.join(' y ')}.`;
}

function graficaValorMercado(j){
  const historial = (j.historialTemporadas || []).filter(h => h.valorMercado != null);
  const puntosBrutos = [
    ...historial.map(h=>({temporada:h.temporada, valor:h.valorMercado, club:h.club, edad: h.edad != null ? h.edad : null})),
    {temporada:S.temporada, valor:j.stats.valorMercado, club:j.club.nombre, edad:j.edad}
  ];
  const vistos = new Set();
  const puntos = puntosBrutos.filter(p=>{ if(vistos.has(p.temporada)) return false; vistos.add(p.temporada); return true; });

  // Colores de cada club, sacados de la trayectoria (con el club actual como respaldo)
  const coloresPorClub = {};
  (j.trayectoria||[]).forEach(e=>{ coloresPorClub[e.club] = e.colores; });
  if(j.club && j.club.nombre && !coloresPorClub[j.club.nombre]) coloresPorClub[j.club.nombre] = j.club.colores;

  const contenedor = document.createElement('div');
  contenedor.className = 'stat-section';

  titulo.innerHTML = `<span class="titulo-linea"></span><span class="titulo-texto">VALOR DE MERCADO</span><span class="titulo-linea"></span>`;
  contenedor.appendChild(titulo);

  const record = puntos.reduce((a,b)=> b.valor > a.valor ? b : a, puntos[0]);
  const statsRow = document.createElement('div');
  statsRow.style.cssText = 'display:flex;gap:14px;margin:10px 0 14px;';
  statsRow.innerHTML = `
    <div style="flex:1;">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:11px;color:var(--ink-soft);margin-bottom:5px;">Valor actual</div>
      <div style="font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;color:var(--gold);line-height:1.1;">${formatearDinero(j.stats.valorMercado)}</div>
    </div>
    <div style="flex:1;text-align:right;">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:11px;color:var(--ink-soft);margin-bottom:5px;">Valor récord</div>
      <div style="font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;color:var(--ink);line-height:1.1;">${formatearDinero(record.valor)}</div>
      <div style="font-family:'Space Grotesk',sans-serif;font-size:11px;color:var(--ink-soft);margin-top:3px;">Temp. ${temporadaAAnoCompleto(record.temporada)}</div>
    </div>
  `;
  contenedor.appendChild(statsRow);

  if(puntos.length < 2) return contenedor;

  const W = 340, H = 150, padX = 8, padTop = 28, padBottom = 8;
  const valores = puntos.map(p=>p.valor);
  const minV = 0, maxV = Math.max(...valores) * 1.12 || 1;
  const xStep = (W - padX*2) / (puntos.length - 1);
  const coordX = i => padX + i*xStep;
  const coordY = v => H - padBottom - ((v - minV)/(maxV - minV)) * (H - padTop - padBottom);
  const coords = puntos.map((p,i)=>[coordX(i), coordY(p.valor)]);
  const pathLinea = coords.map((c,i)=> (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const pathArea = pathLinea + ` L${coords[coords.length-1][0].toFixed(1)},${H-padBottom} L${coords[0][0].toFixed(1)},${H-padBottom} Z`;
  const empiezaEtapa = puntos.map((p,i)=> i===0 || p.club !== puntos[i-1].club);

  const chartWrap = document.createElement('div');
  chartWrap.style.cssText = 'position:relative;';
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('style','width:100%;display:block;');
  svg.innerHTML = `
    <defs><linearGradient id="gradValorMercado" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${pathArea}" fill="url(#gradValorMercado)" stroke="none"/>
    <path d="${pathLinea}" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${coords.map((c,i)=>`<circle class="punto-valor" data-i="${i}" cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="9" fill="transparent" style="cursor:pointer;"/><circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${i===puntos.length-1?4.5:3.2}" fill="${puntos[i]===record?'#EEEFF3':'#D4AF37'}" stroke="#1B1E2A" stroke-width="1.5" style="pointer-events:none;"/>`).join('')}
  `;
  chartWrap.appendChild(svg);

  const tamEscudo = 21;
  puntos.forEach((p,i)=>{
    if(!empiezaEtapa[i]) return;
    const [px,py] = coords[i];
    const arriba = py > tamEscudo + 14;
    const yBadge = arriba ? py - tamEscudo - 7 : py + 7;
    const badge = document.createElement('div');
    badge.style.cssText = `position:absolute;left:${(px/W*100).toFixed(2)}%;top:${(yBadge/H*100).toFixed(2)}%;width:${tamEscudo}px;height:${tamEscudo}px;transform:translateX(-50%);pointer-events:none;`;
    badge.innerHTML = escudoSVG(p.club, tamEscudo, coloresPorClub[p.club]);
    chartWrap.appendChild(badge);
  });

  const tooltip = document.createElement('div');
  tooltip.style.cssText = 'position:absolute;background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;font-family:\'Space Grotesk\',sans-serif;font-size:11.5px;line-height:1.6;color:var(--ink);pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,0.5);opacity:0;transition:opacity .15s ease;white-space:nowrap;z-index:5;';
  chartWrap.appendChild(tooltip);

  chartWrap.querySelectorAll('.punto-valor').forEach(c=>{
    c.addEventListener('click', (e)=>{
      e.stopPropagation();
      const i = parseInt(c.dataset.i);
      const p = puntos[i];
      tooltip.innerHTML = `<span style="color:var(--ink-soft);font-size:10.5px;display:block;margin-bottom:3px;">Temporada ${temporadaAAnoCompleto(p.temporada)}</span>Valor de mercado: <b style="color:var(--gold);">${formatearDinero(p.valor)}</b><br>Club: <b style="color:var(--gold);">${p.club}</b>${p.edad!=null?`<br>Edad: <b style="color:var(--gold);">${p.edad}</b>`:''}`;
      const px = (parseFloat(c.getAttribute('cx')) / W) * 100;
      const py = (parseFloat(c.getAttribute('cy')) / H) * 100;
      tooltip.style.left = Math.min(58, Math.max(2, px - 15)) + '%';
      tooltip.style.top = Math.max(0, py - 38) + '%';
      tooltip.style.opacity = '1';
    });
  });
  document.body.addEventListener('click', ()=>{ tooltip.style.opacity = '0'; });

  contenedor.appendChild(chartWrap);
  const nota = document.createElement('div');
  nota.style.cssText = "font-family:'Space Grotesk',sans-serif;font-size:11px;font-style:italic;color:var(--ink-soft);text-align:center;margin-top:10px;";
  nota.textContent = 'Toca un punto de la gráfica para ver el detalle de esa temporada';
  contenedor.appendChild(nota);

  return contenedor;
}

function resultadoFinalSinJugador(){
  const dadoRival = 1 + Math.floor(Math.random()*20);
  const golesRival = golesPorTramo(dadoRival);
  const dadoPropio = 1 + Math.floor(Math.random()*20);
  const golesPropios = golesPorTramo(dadoPropio); // sin tu bono de tiro, el equipo se las apaña solo
  const empate = golesPropios === golesRival;
  const gana = golesPropios > golesRival || (empate && Math.random() < 0.5);
  return { golesRival, golesPropios, gana, empate, ridiculoHistorico:false, partidazo:false };
}
function resolverSemifinalSinJugador(tipo){
  const exito = Math.random() < 0.4; // sin tu mejor jugador en el campo, cuesta más sacarla adelante
  if(exito){
    if(tipo !== 'playoff' && S.torneoActual && S.torneoActual.rivalFinalPendiente) S.torneoActual.rival = S.torneoActual.rivalFinalPendiente;
    S.screen = tipo === 'playoff' ? 'playoffFinalIntro' : 'torneoFinalIntro';
    if(tipo === 'playoff') S.playoffResultadoTexto = 'El equipo saca adelante la eliminatoria sin ti en el campo. Lo vives desde la grada, con el corazón en un puño, celebrando como si hubieras jugado.';
  } else {
    if(tipo === 'playoff'){
      S.playoffResultadoTexto = 'El equipo cae eliminado. Verlo desde la grada, lesionado y sin poder ayudar, es una de las sensaciones más duras que vas a vivir como futbolista.';
      S.screen = 'playoffEliminado';
    } else {
      const cfg = S.torneoActual;
      S.faseCompeticiones = S.faseCompeticiones || {};
      S.faseCompeticiones[cfg.nombreCompeticion] = 'Semifinales';
      S.torneoEliminadoTexto = `El equipo cae eliminado en semifinales. Lo vives desde la grada, lesionado, sin poder hacer nada por evitarlo. La aventura en la ${cfg.nombreCompeticion} termina antes de lo esperado.`;
      S.screen = 'torneoEliminado';
    }
  }
  render();
}
function golesPorTramo(valor){
  if(valor <= 7) return 0;
  if(valor <= 11) return 1;
  if(valor <= 15) return 2;
  if(valor <= 18) return 3;
  if(valor <= 19) return 4;
  return 5;
}
function golesPorTramoConBono(valor){
  if(valor <= 7) return 0;
  if(valor <= 11) return 1;
  if(valor <= 15) return 2;
  if(valor <= 19) return 3;
  if(valor <= 23) return 4;
  return 5;
}
function rivalClubTorneo(cfg){
  const j = S.jugador;
  if(cfg.tipo === 'copa_domestica'){
    // Peso POR CLUB (no por categoría entera) calibrado para que la categoría del rival en
    // semis/final de Copa del Rey se reparta como en la realidad de los últimos 50 años:
    // LaLiga ~94%, LaLiga2 ~5%, Primera RFEF ~0,8%, Segunda RFEF ~0,2%, Tercera RFEF ~0%
    // (nunca documentado a este nivel — prácticamente excluida).
    const pesoCategoria = { "LaLiga":4.7, "LaLiga2":0.23, "Primera RFEF":0.02, "Segunda RFEF":0.002, "Tercera RFEF":0 };
    const candidatosConPeso = [];
    Object.entries(CLUBES_POR_CATEGORIA).forEach(([categoria, clubes])=>{
      const peso = pesoCategoria[categoria] ?? 0.002;
      if(peso <= 0) return;
      clubes.forEach(c=>{ if(c.nombre !== j.club.nombre && !primerEquipoDeFilial(c.nombre)) candidatosConPeso.push({ club:c, peso }); });
    });
    const pesoTotal = candidatosConPeso.reduce((s,c)=>s+c.peso, 0);
    let dado = Math.random() * pesoTotal;
    let elegido = candidatosConPeso[candidatosConPeso.length-1].club;
    for(const c of candidatosConPeso){
      dado -= c.peso;
      if(dado <= 0){ elegido = c.club; break; }
    }
    return { nombre: elegido.nombre, colores: elegido.colores, pais:'España' };
  }
  if(['club_sudamerica','club_concacaf','club_asia'].includes(cfg.tipo)){
    // Mismo criterio que las competiciones UEFA: ponderado por prestigio × liga del país
    // (Brasil/Argentina sobre Uruguay/Chile, México sobre la MLS...), no uniforme al azar.
    let candidatos;
    if(cfg.tipo === 'club_sudamerica') candidatos = CLUBES_EXTRANJERO.filter(c => PAISES_SUDAMERICANOS.includes(c.pais) && c.nombre !== j.club.nombre);
    else if(cfg.tipo === 'club_concacaf') candidatos = CLUBES_EXTRANJERO.filter(c => PAISES_CONCACAF.includes(c.pais) && c.nombre !== j.club.nombre);
    else candidatos = CLUBES_EXTRANJERO.filter(c => PAISES_ASIA.includes(c.pais) && c.nombre !== j.club.nombre);
    if(!candidatos.length) candidatos = CLUBES_EXTRANJERO.filter(c => c.nombre !== j.club.nombre);
    const pesoRegional = c => (PRESTIGIO_CLUB[c.nombre]||2) * (FACTOR_LIGA_PAIS[c.pais] ?? 0.25);
    const candidatosConPesoRegional = candidatos.map(c => ({ club:c, peso: pesoRegional(c) }));
    const pesoTotalRegional = candidatosConPesoRegional.reduce((s,c)=>s+c.peso, 0);
    let dadoRegional = Math.random() * pesoTotalRegional;
    let elegidoRegional = candidatosConPesoRegional[candidatosConPesoRegional.length-1].club;
    for(const c of candidatosConPesoRegional){
      dadoRegional -= c.peso;
      if(dadoRegional <= 0){ elegidoRegional = c.club; break; }
    }
    return elegidoRegional;
  }
  // Champions / Europa League / Conference: un único reparto ponderado por prestigio que
  // mete a España en la misma bolsa que el resto de la UEFA (antes España tenía su propio
  // 22% de posibilidades sin mirar el prestigio, así que podía tocarte de rival cualquier
  // equipo de LaLiga, hasta el colista, en una semifinal de Champions). La franja tierMin-
  // tierMax (a qué clubes deja entrar la competición) usa el prestigio tal cual, relativo a
  // su propio país; pero el PESO para elegir entre ellos aplica además FACTOR_LIGA_PAIS,
  // porque un 3 en Croacia o Turquía no pesa lo mismo en Europa que un 3 en España o Inglaterra.
  const clubesEspanoles = CLUBES_POR_CATEGORIA["LaLiga"].map(c => ({ ...c, pais:'España' }));
  const clubesUefa = CLUBES_EXTRANJERO.filter(c => PAISES_UEFA.includes(c.pais));
  const pool = [...clubesEspanoles, ...clubesUefa].filter(c => c.nombre !== j.club.nombre);
  const pesoClub = c => (PRESTIGIO_CLUB[c.nombre]||2) * (FACTOR_LIGA_PAIS[c.pais] ?? 0.25);
  let candidatosConPeso = pool
    .filter(c => (PRESTIGIO_CLUB[c.nombre]||2) >= cfg.tierMin && (PRESTIGIO_CLUB[c.nombre]||2) <= cfg.tierMax)
    .map(c => ({ club:c, peso: pesoClub(c) }));
  if(!candidatosConPeso.length) candidatosConPeso = pool.map(c => ({ club:c, peso: pesoClub(c) }));
  const pesoTotal = candidatosConPeso.reduce((s,c)=>s+c.peso, 0);
  let dado = Math.random() * pesoTotal;
  let elegido = candidatosConPeso[candidatosConPeso.length-1].club;
  for(const c of candidatosConPeso){
    dado -= c.peso;
    if(dado <= 0){ elegido = c.club; break; }
  }
  return { nombre: elegido.nombre, colores: elegido.colores, pais: elegido.pais };
}

function acumularEstadisticasSeleccion(j, cfg, nombreCompeticion){
  // El juego solo "ve" a la selección en los torneos de verano; se asume el recorrido completo
  // del torneo (fase de grupos + eliminatorias) y se acumulan partidos/goles/asistencias.
  const sub21 = cfg.tipo === 'seleccion_sub21';
  const partidos = 5 + Math.floor(Math.random()*3);
  const tasaGol = Math.min(0.6, 0.12 + (j.atributos.tiro/ATRIBUTO_MAX)*0.34 + (j.atributos.desmarque/ATRIBUTO_MAX)*0.12);
  const goles = Math.max(0, Math.round(partidos * tasaGol * (0.65 + Math.random()*0.7)));
  const asistencias = Math.max(0, Math.round(partidos * (0.06 + (j.atributos.pase/ATRIBUTO_MAX)*0.16) * (0.6 + Math.random()*0.8)));
  j.carrera.partidosSeleccion = (j.carrera.partidosSeleccion||0) + partidos;
  j.carrera.golesSeleccion = (j.carrera.golesSeleccion||0) + goles;
  j.carrera.asistenciasSeleccion = (j.carrera.asistenciasSeleccion||0) + asistencias;
  j.historialSeleccion = j.historialSeleccion || [];
  j.historialSeleccion.push({ temporada: S.temporada, torneo: nombreCompeticion, sub21, partidos, goles, asistencias });
}
function iniciarTorneoEliminatorio(cfg){
  const j = S.jugador;
  const esSeleccion = cfg.tipo === 'seleccion' || cfg.tipo === 'seleccion_sub21';
  let rivalSemi, rivalFinal, nombreCompeticion;
  if(esSeleccion){
    const nombreTorneo = torneoDeVerano(S.temporada) || 'Torneo internacional';
    const poolRivales = nombreTorneo === 'Eurocopa' ? RIVALES_EUROCOPA : RIVALES_MUNDIAL;
    const [paisSemi, paisFinal] = elegirRivalesSeleccion(poolRivales);
    rivalSemi = { nombre: paisSemi };
    rivalFinal = { nombre: paisFinal };
    nombreCompeticion = nombreTorneo + (cfg.tipo === 'seleccion_sub21' ? ' Sub-21' : '');
  } else {
    const clubSemi = rivalClubTorneo(cfg);
    let clubFinal = rivalClubTorneo(cfg);
    let intentos = 0;
    while(clubFinal.nombre === clubSemi.nombre && intentos < 8){ clubFinal = rivalClubTorneo(cfg); intentos++; }
    rivalSemi = { nombre: clubSemi.nombre, colores: clubSemi.colores };
    rivalFinal = { nombre: clubFinal.nombre, colores: clubFinal.colores };
    nombreCompeticion = cfg.nombreCompeticion;
  }
  const datosTexto = { rival: rivalSemi.nombre, competicion: nombreCompeticion };
  const pool = esSeleccion ? TEXTOS_SEMIFINAL_SELECCION : TEXTOS_SEMIFINAL_CLUB;
  const poolOpciones = esSeleccion ? OPCIONES_SEMIFINAL_SELECCION : OPCIONES_SEMIFINAL_CLUB;
  let idxTexto = Math.floor(Math.random()*pool.length);
  if(pool.length > 1 && idxTexto === (j._ultimoTextoSemifinalIdx ?? -1)){
    idxTexto = (idxTexto + 1 + Math.floor(Math.random()*(pool.length-1))) % pool.length;
  }
  j._ultimoTextoSemifinalIdx = idxTexto;
  S.torneoActual = {
    id: cfg.id, tipo: cfg.tipo, nombreCompeticion, sinSemifinal: !!cfg.sinSemifinal, rival: cfg.sinSemifinal ? rivalFinal : rivalSemi, rivalFinalPendiente: rivalFinal,
    efectosVictoria: cfg.efectosVictoria,
    textoSemifinal: pool[idxTexto](datosTexto),
    opcionesSemifinal: poolOpciones[Math.floor(Math.random()*poolOpciones.length)]
  };
  j.historial.push({ temporada:S.temporada, evento:'torneo_'+cfg.id });
  if(esSeleccion) acumularEstadisticasSeleccion(j, cfg, nombreCompeticion);
  const claveConvocatoria = esSeleccion ? (cfg.tipo === 'seleccion_sub21' ? 'tuvoPrimeraConvocatoriaSub21' : 'tuvoPrimeraConvocatoriaAbsoluta') : null;
  if(esSeleccion && !j[claveConvocatoria]){
    j[claveConvocatoria] = true;
    S.screen = 'primeraConvocatoria';
    return;
  }
  S.screen = cfg.sinSemifinal ? 'torneoFinalIntro' : 'torneoSemifinal';
}

SCREENS.torneoSemifinal = function(){
  const j = S.jugador;
  const cfg = S.torneoActual;
  const esSeleccion = cfg.tipo === 'seleccion' || cfg.tipo === 'seleccion_sub21';
  if(j.lesionSemanas > 0){
    topbar(cfg.nombreCompeticion);
    const c = el('div','card');
    c.appendChild(crearEyebrow(esSeleccion ? 'Semifinal del torneo' : 'Semifinal'));
    c.appendChild(el('h2',null,'Ves el partido desde la grada'));
    c.appendChild(el('div','lore-box', `Tu lesión te deja fuera de la semifinal de ${cfg.nombreCompeticion}. Vives el partido desde la grada, sin poder ayudar al equipo cuando más lo necesita.`));
    const btn = document.createElement('button'); btn.className='btn-main'; btn.textContent='Ver cómo termina →';
    btn.onclick = ()=> resolverSemifinalSinJugador('torneo');
    c.appendChild(btn);
    app.appendChild(c);
    return;
  }
  topbar(cfg.nombreCompeticion);
  const c = el('div','card');
  c.appendChild(crearEyebrow(esSeleccion ? 'Semifinal del torneo' : 'Semifinal'));
  c.appendChild(el('h2',null, cfg.nombreCompeticion));
  c.appendChild(el('div','lore-box', cfg.textoSemifinal));

  const dificultades = cfg.opcionesSemifinal.map(op=>op.dificultadBase);
  const maxDificultad = Math.max(...dificultades);

  cfg.opcionesSemifinal.forEach(op=>{
    const b = el('div','opt');
    b.appendChild(document.createTextNode(op.texto));
    const tirada = { atributo:op.atributo, dificultadBase:op.dificultadBase };
    const p = probabilidadExito(j, tirada);
    const esLaMasDificil = op.dificultadBase === maxDificultad && dificultades[0] !== dificultades[1];
    const tag = el('span','tag');
    tag.appendChild(el('span','tag-pill', `🎲 Dificultad ${p.dificultad}`));
    tag.appendChild(el('span','tag-pill', `${NICE_ATTR[op.atributo]} +${p.bonoAtributo}`));
    p.mods.forEach(m=> tag.appendChild(el('span','tag-pill', m)) );
    tag.appendChild(el('span','tag-pill pct', etiquetaProbabilidad(p.pct)));
    if(esLaMasDificil) tag.appendChild(el('span','tag-pill pos', '⭐ más mérito si sale bien'));
    b.appendChild(tag);
    b.onclick = ()=>{
      const opConTirada = { ...op, tirada };
      S.pendingRoll = { j, ev:{id:'torneo_semifinal'}, op:opConTirada, r: tirar(j, tirada), esSemifinal:true, tipoSemifinal:'torneo', masMerito: esLaMasDificil };
      S.screen = 'tirando';
      render();
    };
    c.appendChild(b);

    if(j.objetos.inspiracion>0){
      const tokenBtn = document.createElement('div');
      tokenBtn.className = 'opt-token-icono';
      tokenBtn.title = `Usar Golpe de Inspiración (+4) · te quedan ${j.objetos.inspiracion}`;
      tokenBtn.innerHTML = ICONOS_SVG.inspiracion;
      tokenBtn.onclick = (e)=>{
        e.stopPropagation();
        j.objetos.inspiracion--;
        const opConTirada = { ...op, tirada };
        S.pendingRoll = { j, ev:{id:'torneo_semifinal'}, op:opConTirada, r: tirar(j, tirada, 4), esSemifinal:true, tipoSemifinal:'torneo', masMerito: esLaMasDificil, conToken:'inspiracion' };
        S.screen = 'tirando';
        render();
      };
      b.appendChild(tokenBtn);
    } else if(j.objetos.vestuario>0){
      const tokenBtn2 = document.createElement('div');
      tokenBtn2.className = 'opt-token-icono vestuario';
      tokenBtn2.title = `Usar Palabras del vestuario (+2) · te quedan ${j.objetos.vestuario}`;
      tokenBtn2.innerHTML = ICONOS_SVG.vestuario;
      tokenBtn2.onclick = (e)=>{
        e.stopPropagation();
        j.objetos.vestuario--;
        const opConTirada = { ...op, tirada };
        S.pendingRoll = { j, ev:{id:'torneo_semifinal'}, op:opConTirada, r: tirar(j, tirada, 2), esSemifinal:true, tipoSemifinal:'torneo', masMerito: esLaMasDificil, conToken:'vestuario' };
        S.screen = 'tirando';
        render();
      };
      b.appendChild(tokenBtn2);
    }
  });
  app.appendChild(c);
};

SCREENS.torneoFinal = function(){
  const j = S.jugador;
  const cfg = S.torneoActual;
  if(j.lesionSemanas > 0){
    topbar(cfg.nombreCompeticion);
    const c = el('div','card');
    c.appendChild(crearEyebrow('El partido más importante del año'));
    c.appendChild(el('h2',null, `Ves la final contra ${cfg.rival.nombre} desde la grada`));
    c.appendChild(el('div','event-text', 'Tu lesión te deja fuera justo del partido más importante del año. Lo vives con el corazón en un puño, sin poder hacer nada por ayudar.'));
    const btn = document.createElement('button'); btn.className='btn-main'; btn.textContent='Ver cómo termina →';
    btn.onclick = ()=>{ S.torneoFinalResultado = resultadoFinalSinJugador(); S.screen = 'torneoFinalReveal'; render(); };
    c.appendChild(btn);
    app.appendChild(c);
    return;
  }
  topbar(cfg.nombreCompeticion);
  const c = el('div','card');
  c.appendChild(crearEyebrow('El partido más importante del año'));
  c.appendChild(el('h2',null, `Final contra ${cfg.rival.nombre}`));
  const tieneVentaja = !!S.ventajaFinalNatural20;
  c.appendChild(el('div','event-text', tieneVentaja
    ? 'Todo se decide aquí. Llegas con la confianza extra de aquella actuación en semifinales todavía muy presente.'
    : 'Todo se decide aquí. Sal a jugarte el partido de tu vida.'));
  if(tieneVentaja) c.appendChild(el('div','lore-box', '⭐ Tu actuación de semifinales te da un empujón extra para esta final.'));
  function jugarFinal(bonoExtra){
    const bonoVentaja = tieneVentaja ? 3 : 0;
    S.ventajaFinalNatural20 = false;
    const dadoRival = 1 + Math.floor(Math.random()*20);
    const golesRival = golesPorTramo(dadoRival);

    const r = tirar(j, { atributo:'tiro', dificultadBase:0 }, (bonoExtra||0) + bonoVentaja);
    const bonoGol = Math.round(j.atributos.tiro / 5) + Math.round(((bonoExtra||0) + bonoVentaja)/2);
    let golesPropios, ridiculoHistorico = false, partidazo = false;
    if(r.dado === 1){
      golesPropios = 0;
      ridiculoHistorico = true;
    } else if(r.dado === 20){
      golesPropios = 5;
      partidazo = true;
    } else {
      golesPropios = golesPorTramoConBono(r.dado + bonoGol);
    }
    const empate = golesPropios === golesRival;
    const gana = golesPropios > golesRival || (empate && Math.random() < 0.5);
    S.torneoFinalResultado = { golesRival, golesPropios, gana, empate, ridiculoHistorico, partidazo };
    S.screen = 'torneoFinalReveal';
    render();
  }
  const btn = document.createElement('button'); btn.className='btn-main'; btn.textContent='Salir a jugar →';
  btn.onclick = ()=>jugarFinal(0);
  c.appendChild(btn);
  if(j.objetos.inspiracion>0){
    const b2 = document.createElement('button'); b2.className='btn-main';
    b2.style.cssText = 'margin-top:8px;background:transparent;border:1px solid var(--gold);color:var(--gold);';
    b2.innerHTML = `${iconoInline('inspiracion',15)}Usar Golpe de Inspiración (+4) y salir a jugar · te quedan ${j.objetos.inspiracion}`;
    b2.onclick = ()=>{ j.objetos.inspiracion--; jugarFinal(4); };
    c.appendChild(b2);
  } else if(j.objetos.vestuario>0){
    const b3 = document.createElement('button'); b3.className='btn-main';
    b3.style.cssText = 'margin-top:8px;background:transparent;border:1px solid var(--gold);color:var(--gold);';
    b3.innerHTML = `${iconoInline('vestuario',15)}Usar Palabras del vestuario (+2) y salir a jugar · te quedan ${j.objetos.vestuario}`;
    b3.onclick = ()=>{ j.objetos.vestuario--; jugarFinal(2); };
    c.appendChild(b3);
  }
  app.appendChild(c);
};

SCREENS.playoffFinal = function(){
  const j = S.jugador;
  const rival = S.playoffRival || (S.playoffRival = clubAleatorio(j.club.categoria, j.club.nombre));
  if(j.lesionSemanas > 0){
    topbar("Final del playoff");
    const c = el('div','card');
    c.appendChild(crearEyebrow('El partido más importante del año'));
    c.appendChild(el('h2',null,`Ves la final del ascenso contra ${rival.nombre} desde la grada`));
    c.appendChild(el('div','event-text', 'Tu lesión te deja fuera justo del partido más importante del año. Lo vives con el corazón en un puño, sin poder hacer nada por ayudar.'));
    const btn = document.createElement('button'); btn.className='btn-main'; btn.textContent='Ver cómo termina →';
    btn.onclick = ()=>{ S.playoffFinalResultado = { ...resultadoFinalSinJugador(), rival }; S.screen = 'playoffFinalReveal'; render(); };
    c.appendChild(btn);
    app.appendChild(c);
    return;
  }
  topbar("Final del playoff");
  const c = el('div','card');
  c.appendChild(crearEyebrow('El partido más importante del año'));
  c.appendChild(el('h2',null,`La final del ascenso contra ${rival.nombre}`));
  const tieneVentajaPlayoff = !!S.ventajaFinalNatural20;
  c.appendChild(el('div','event-text', tieneVentajaPlayoff
    ? 'Todo se decide aquí. El campo está a reventar, y llegas con la confianza extra de aquella actuación en semifinales todavía muy presente.'
    : 'Todo se decide aquí. El campo está a reventar. Sal a jugarte el partido de tu vida.'));
  if(tieneVentajaPlayoff) c.appendChild(el('div','lore-box', '⭐ Tu actuación de semifinales te da un empujón extra para esta final.'));
  const btn = document.createElement('button'); btn.className='btn-main'; btn.textContent='Salir a jugar →';
  btn.onclick = ()=>{
    const bonoVentajaPlayoff = tieneVentajaPlayoff ? 3 : 0;
    S.ventajaFinalNatural20 = false;
    const dadoRival = 1 + Math.floor(Math.random()*20);
    const golesRival = golesPorTramo(dadoRival);

    const r = tirar(j, { atributo:'tiro', dificultadBase:0 }, bonoVentajaPlayoff);
    const bonoGol = Math.round(j.atributos.tiro / 5) + Math.round(bonoVentajaPlayoff/2);
    let golesPropios, ridiculoHistorico = false, partidazo = false;
    if(r.dado === 1){
      golesPropios = 0;
      ridiculoHistorico = true;
    } else if(r.dado === 20){
      golesPropios = 5;
      partidazo = true;
    } else {
      golesPropios = golesPorTramoConBono(r.dado + bonoGol);
    }
    const empate = golesPropios === golesRival;
    const gana = golesPropios > golesRival || (empate && Math.random() < 0.5);
    S.playoffFinalResultado = { golesRival, golesPropios, gana, empate, ridiculoHistorico, partidazo, rival };
    S.screen = 'playoffFinalReveal';
    render();
  };
  c.appendChild(btn);
  app.appendChild(c);
};

SCREENS.finTemporada = function(){
  const j = S.jugador;
  const r = S.temporadaResumen;
  topbar("Fin de temporada");

  const modal = el('div','card resumen-card');
  const clubParaCabecera = { ...j.club, categoria: r.categoriaJugada || j.club.categoria };
  modal.appendChild(crearEyebrow(`${j.club.nombre} (${categoriaCorta(clubParaCabecera)})`));
  modal.appendChild(el('h2',null, `"${r.titular}"`));

  // Sección 1: estadísticas principales, en horizontal
  const statsRow = el('div','reveal-stats-row');
  [['Partidos', r.partidos], ['Goles', r.goles], ['Asistencias', r.asistencias]].forEach(([lbl,val])=>{
    const box = el('div','reveal-stat-box');
    box.appendChild(el('div','num', val));
    box.appendChild(el('div','lbl', lbl));
    statsRow.appendChild(box);
  });
  modal.appendChild(statsRow);

  // Sección 2: liga y demás competiciones, en vertical
  const filasCompeticion = [];
  const nombreLiga = j.club.extranjero ? j.club.liga : ((r.categoriaJugada||j.club.categoria) === "LaLiga" ? "LaLiga" : TIER_CATEGORIA[r.categoriaJugada||j.club.categoria]);
  const valorPosicion = r.posicionFinal === 1 ? 'Campeón' : (r.posicionFinal === 2 ? 'Subcampeón' : `${r.posicionFinal}º/${EQUIPOS_EN_LIGA}`);
  filasCompeticion.push([`${logoCompeticion(nombreLiga,15)}${nombreLiga}`, valorPosicion, true, r.posicionFinal === 1]);
  if(r.objetivoTexto) filasCompeticion.push([`${iconoInline('objetivo',13)}Objetivo: ${ABREVIATURA_OBJETIVO[r.objetivoTipo] || r.objetivoTexto}`, r.objetivoCumplido ? iconoInline('check',13) : iconoInline('cruz',13), true]);
  if(r.ascenso) filasCompeticion.push([`${iconoInline('ascenso',13)}Ascenso`, 'Conseguido', true]);
  (r.fasesCompeticiones||[]).forEach(f=>{
    const etiqueta = `${logoCompeticion(f.nombre,15)}${f.nombre}`;
    filasCompeticion.push([etiqueta, f.fase, true, f.fase === 'Campeón']);
  });
  const nombresYaCubiertos = new Set((r.fasesCompeticiones||[]).map(f=>f.nombre));
  (S.titulosTemporadaActual||[]).forEach(nombreTitulo=>{
    if(nombresYaCubiertos.has(nombreTitulo)) return;
    if(nombreTitulo === nombreLiga) return; // ya se muestra como posición/Campeón de liga
    filasCompeticion.push([`${logoCompeticion(nombreTitulo,15)}${nombreTitulo}`, 'Campeón', true, true]);
  });

  // Sección 3: títulos individuales, en vertical
  const filasIndividual = [];
  if(r.pichichi) filasIndividual.push([`${iconoInline('trofeo',13)}Pichichi`, iconoInline('check',13), true]);
  if(r.botaOro) filasIndividual.push([`${iconoInline('trofeo',13)}Bota de Oro`, iconoInline('check',13), true]);
  if(r.mvp) filasIndividual.push([`${iconoInline('estrella',13)}Mejor jugador de la liga (MVP)`, iconoInline('check',13), true]);
  if(r.balonDeOroPuesto) filasIndividual.push([`${iconoInline('estrella',13)}Balón de Oro`, r.balonDeOroPuesto===1 ? '🥇 1º' : (r.balonDeOroPuesto===2 ? '🥈 2º' : '🥉 3º'), true, r.balonDeOroPuesto===1]);
  if(r.enOnceIdeal) filasIndividual.push([`${iconoInline('estrella',13)}Once ideal de la temporada`, iconoInline('check',13), true]);

  // Sección 4: promesas resueltas esta temporada, en último lugar
  const filasPromesas = [];
  (S.resultadoPromesas||[]).forEach(res=>{
    filasPromesas.push([`"${res.texto}"`, res.cumplida ? iconoInline('check',13) : iconoInline('cruz',13), true, res.cumplida]);
  });

  function pintarSeccion(titulo, filas){
    if(!filas.length) return [];
    modal.appendChild(el('div','reveal-section-title', titulo));
    return filas.map(([lbl,val,valPequeno,oro])=>{
      const row = el('div','reveal-row');
      row.appendChild(el('span','lbl', lbl));
      row.appendChild(el('span','val'+(valPequeno?' small':'')+(oro?' oro':''), val));
      modal.appendChild(row);
      return row;
    });
  }
  const filasEl = [
    ...pintarSeccion('Competiciones', filasCompeticion),
    ...pintarSeccion('Títulos individuales', filasIndividual),
    ...pintarSeccion('Promesas', filasPromesas)
  ];

  const notaValor = r.nota;
  const claseNota = r.mvp ? 'nota-azul' : (notaValor < 6 ? 'nota-roja' : (notaValor < 7 ? 'nota-naranja' : 'nota-verde'));
  const notaBox = el('div','reveal-nota '+claseNota);
  notaBox.appendChild(el('div','lbl','Nota media de la temporada'));
  notaBox.appendChild(el('div','num', formatearNumero(notaValor)));
  modal.appendChild(notaBox);

  const btn = document.createElement('button'); btn.className='btn-main'; btn.style.marginTop='22px'; btn.textContent='Empezar temporada siguiente →';
  btn.onclick = ()=>{
    S.resultadoPromesas = null;
    j.edad += 1;
    j.stats.forma = 55;
    j.contrato.duracionTemporadas -= 1;
    if(j.patrocinio){
      j.patrocinio.duracionTemporadas = (j.patrocinio.duracionTemporadas!=null ? j.patrocinio.duracionTemporadas : 1) - 1;
      if(j.patrocinio.duracionTemporadas <= 0) j.patrocinio = null;
    }
    j.carrera.titulos += (S.titulosTemporadaActual||[]).length;
    j.club.clasificacionEuropea = !!r.clasificacionEuropea;
    j.club.nivelEuropeo = r.nivelEuropeo || null;
    S.temporada += 1;
    const contratoTerminado = j.contrato.duracionTemporadas <= 0;
    const probRetiro = j.edad >= 35 ? Math.min(1, (j.edad - 34) * 0.13) : 0;
    const seRetira = j.edad >= 42 || (contratoTerminado && Math.random() < probRetiro);
    const ofreceMejoraPorAscenso = r.ascenso && !contratoTerminado && !seRetira;
    S.siguientePantalla = seRetira ? 'retiro' : (ofreceMejoraPorAscenso ? 'mejoraContratoAscenso' : (contratoTerminado ? 'renovacion' : 'ofertas'));
    if(S.siguientePantalla === 'ofertas') S.ofertasActuales = generarOfertas(j);
    S.screen = S.siguientePantalla;
    render();
  };
  modal.appendChild(btn);
  app.appendChild(modal);

  statsRow.classList.add('show');
  filasEl.forEach((row,i)=>{
    setTimeout(()=>row.classList.add('show'), 400 + i*650);
  });
  setTimeout(()=>{
    notaBox.classList.add('show');
    Sonido.exito();
  }, 400 + filasEl.length*650 + 500);
  setTimeout(()=> btn.classList.add('show'), 400 + filasEl.length*650 + 1200);
};

  const adrianEsCandidato = j.rival.trayectoriaIniciada && j.rival.nivel >= 4 && Math.random() < 0.45;
  let rivales;
  if(adrianEsCandidato){
    const otro = CANDIDATOS_BALON_ORO[Math.floor(Math.random()*CANDIDATOS_BALON_ORO.length)];
    rivales = Math.random()<0.5 ? [j.rival.nombre, otro] : [otro, j.rival.nombre];
  } else {
    rivales = [...CANDIDATOS_BALON_ORO].sort(()=>Math.random()-0.5).slice(0,2);
  }
  const podio = [null,null,null];
  podio[r.balonDeOroPuesto-1] = j.nombre;
  let idxRival = 0;
  for(let i=0;i<3;i++){ if(!podio[i]){ podio[i] = rivales[idxRival]; idxRival++; } }

  topbar("Gala del Balón de Oro");
  const c = el('div','card');
  c.appendChild(crearEyebrow('Los mejores del año'));
  c.appendChild(el('h2',null,'Balón de Oro'));
  c.appendChild(el('div','event-text', 'La gala repasa a los mejores futbolistas del año. Poco a poco se van desvelando los tres primeros puestos.'));
  if(adrianEsCandidato){
    c.appendChild(el('div','lore-box', `Entre los nominados está ${j.rival.nombre}. Verlo ahí, compitiendo por lo mismo que tú, te recuerda que aquella tarde de hace años sigue muy viva entre los dos.`));
  }

  const filasEl = [3,2,1].map(puesto=>{
    const nombre = podio[puesto-1];
    const esJugador = nombre === j.nombre;
    const row = el('div','reveal-row'+(esJugador?' campeon':''));
    row.appendChild(el('span','lbl', `${puesto}º puesto`));
    row.appendChild(el('span','val'+(esJugador?'':' small'), nombre));
    c.appendChild(row);
    return row;
  });

  const trofeoBox = el('div','balon-oro-trofeo');
  trofeoBox.innerHTML = iconoInline('trofeo', 56);
  trofeoBox.style.color = 'var(--gold)';
  c.appendChild(trofeoBox);

  const btn = document.createElement('button'); btn.className='btn-main show'; btn.textContent='Seguir →';
  btn.style.opacity = '0';
  btn.onclick = irASiguienteReveal;
  c.appendChild(btn);
  app.appendChild(c);

  filasEl.forEach((row,i)=> setTimeout(()=>row.classList.add('show'), 400 + i*900));
  if(ganaste){
    setTimeout(()=>{
      c.classList.add('balon-oro-ganador');
      trofeoBox.classList.add('show');
      Sonido.trofeo();
    }, 400 + filasEl.length*900);
  }
  setTimeout(()=>{ btn.style.opacity = '1'; }, 400 + filasEl.length*900 + 500);
};

SCREENS.renovacion = function(){
  const j = S.jugador;
  if(j.edad >= 42){ S.screen = 'retiro'; return SCREENS.retiro(); }
  if(S.clubDeclinaRenovar === undefined){
    const notaBaja = (j.ultimaNotaTemporada || 6.5) < 5.8;
    const edadAvanzada = j.edad >= 33;
    const clubHumilde = (PRESTIGIO_CLUB[j.club.nombre] || 2) <= 1;
    const probDeclinar = (notaBaja ? 0.32 : 0.04) + (edadAvanzada ? 0.15 : 0) + (clubHumilde ? 0.08 : 0);
    S.clubDeclinaRenovar = Math.random() < Math.min(0.6, probDeclinar);
    S.razonNoRenovacion = notaBaja ? 'deportiva' : 'economica';
  }
  topbar("Renovación de contrato");
  const c = el('div','card');

  if(S.clubDeclinaRenovar){
    c.appendChild(crearEyebrow('Tu contrato ha terminado'));
    c.appendChild(el('h2',null,'No hay renovación'));

      : `${articuloClub(j.club.nombre)==='la'?'La':'El'} ${j.club.nombre} te comunica que, por la situación económica del club, no pueden afrontar una renovación este verano. No es nada personal, son números.`;

  app.appendChild(c);
};
