<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fichaje 10 — modo carrera</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161F">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fichaje 10">
<meta name="mobile-web-app-capable" content="yes">

<style>
@import url('https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root{
  --bg: #14161F;
  --bg2: #1B1E2A;
  --panel: #1F2330;
  --panel2: #262B3C;
  --ink: #EEEFF3;
  --ink-soft: #8D93A6;
  --gold: #D4AF37;
  --gold-dim: #A9862B;
  --steel: #6E88A8;
  --red: #D9495C;
  --amber: #E0932E;
  --green: #4CAF6D;
  --line: rgba(255,255,255,0.11);
  --shadow: 0 14px 34px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{ overscroll-behavior-y:contain; }
body{
  overscroll-behavior-y:contain;
  background: linear-gradient(175deg, var(--bg2), var(--bg) 55%);
  color: var(--ink);
  font-family: 'Space Grotesk',sans-serif;
  font-weight: 400;
  min-height: 100vh;
  padding: calc(82px + env(safe-area-inset-top,0px)) 16px 60px;
}
.wrap{ max-width: 760px; margin: 0 auto; }
body.con-tabbar{ padding-bottom: 92px; }
body.con-barra-entreno{ padding-bottom: 168px; }
body.sin-topbar{ padding-top: calc(24px + env(safe-area-inset-top,0px)); }
#tabbar-root{ position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; flex-direction:column; }
.tabbar{
  display:flex; justify-content:space-around; align-items:stretch;
  background:rgba(20,22,31,0.96); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
}
.tabbar-btn{
  flex:1; max-width:140px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; padding:6px 4px; border-radius:10px; cursor:pointer; color:var(--ink-soft); position:relative;
  font-family:'Space Grotesk',sans-serif; font-size:10.5px; font-weight:600; letter-spacing:.02em;
  transition:color .15s, background .15s;
}
.tabbar-badge{
  position:absolute; top:2px; right:calc(50% - 26px); min-width:15px; height:15px; padding:0 3px;
  border-radius:8px; background:var(--gold); color:#1a1408; font-family:'Space Grotesk',sans-serif;
  font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,0.4);
}
.tabbar-btn svg{ width:21px; height:21px; }
.tabbar-btn:active{ background:rgba(255,255,255,0.06); }
.tabbar-btn.activo{ color:var(--gold); }
.tabbar.deshabilitada .tabbar-btn{ opacity:.32; pointer-events:none; }
.tabbar-btn.destacado{ color:var(--ink); }
.tabbar-btn.destacado.activo{ color:var(--gold); }
.barra-entreno{
  background:rgba(38,43,60,0.97); backdrop-filter:blur(10px);
  border-top:1px solid var(--line); padding:16px 14px 11px; cursor:pointer; position:relative;
}
.barra-entreno-titulo{
  position:absolute; top:-13px; left:50%; transform:translateX(-50%);
  background:var(--panel2); border:1px solid rgba(255,255,255,0.22); border-radius:20px; padding:3px 14px 3px 12px;
  font-family:'Space Grotesk',sans-serif; font-size:9.5px; font-weight:700; letter-spacing:.08em;
  color:var(--ink); white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,0.4);
  display:flex; align-items:center; gap:5px;
}
.barra-entreno-flecha{ font-size:9px; color:var(--ink-soft); transition:transform .25s ease; display:inline-block; }
.barra-entreno-fila{ display:flex; align-items:center; justify-content:center; gap:10px; max-width:760px; margin:0 auto; }
.mini-barras{ flex:1; display:flex; justify-content:space-between; gap:4px; max-width:420px; margin:0 auto; }
.mini-barra-item{ display:flex; flex-direction:column; align-items:center; min-width:0; }
.mini-circulo{ position:relative; width:46px; height:46px; }
.mini-circulo.grande{ width:58px; height:58px; }
.mini-circulo svg{ width:100%; height:100%; transform:rotate(-90deg); }
.mini-circulo-centro{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
}
.mini-circulo-ic{
  font-family:'Space Grotesk',sans-serif; font-size:10.5px; font-weight:700; white-space:nowrap; line-height:1;
}
.mini-circulo.grande .mini-circulo-ic{ font-size:12px; }
.mini-circulo-valor{
  font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:400; color:var(--ink); white-space:nowrap; line-height:1;
}
.mini-circulo.grande .mini-circulo-valor{ font-size:13.5px; }
.notif-wrap{ position:absolute; bottom:100%; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:6px; padding:0 14px 20px; pointer-events:none; }
.notif-wrap .notif-toast{ pointer-events:auto; }
.notif-wrap:not(:empty){ padding-top:8px; }
.notif-toast{
  display:flex; align-items:center; gap:8px; max-width:360px; width:auto;
  background:var(--panel2); border:1.5px solid var(--gold); border-radius:10px; padding:9px 14px;
  font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:600; color:var(--ink);
  box-shadow:0 6px 16px rgba(0,0,0,0.4); animation:notifIn .25s ease;
}
.notif-toast.objeto{ border-color:var(--gold); }
.notif-toast.atributo{ border-color:var(--gold); }
.notif-toast.riesgo{ border-color:var(--red); }
@keyframes notifIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
.panel-entreno-overlay{
  position:fixed; inset:0; background:rgba(5,7,15,0); z-index:70;
  display:flex; align-items:flex-end; justify-content:center;
  transition:background .28s ease;
}
.panel-entreno-overlay.show{ background:rgba(5,7,15,0.75); }
.panel-entreno{
  background:var(--panel2); border-top:1px solid var(--line); border-radius:18px 18px 0 0;
  padding:16px 18px calc(20px + env(safe-area-inset-bottom,0px)); width:100%; max-width:500px;
  box-shadow:0 -10px 30px rgba(0,0,0,0.5); max-height:85vh; overflow-y:auto;
  transform:translateY(100%); transition:transform .3s cubic-bezier(.25,.8,.35,1);
}
.panel-entreno-overlay.show .panel-entreno{ transform:translateY(0); }
.panel-entreno-titulo-fija{
  display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:14px;
}
.panel-entreno-titulo-fija .titulo{
  font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--ink); margin-bottom:12px;
}
.panel-entreno-circulos{ display:flex; justify-content:space-between; gap:8px; width:100%; max-width:420px; }
.panel-entreno-hint{
  font-family:'Space Grotesk',sans-serif; font-size:11.5px; color:var(--ink-soft); text-align:center;
  margin:12px 0 16px; line-height:1.5;
}
.fila-atributo-entreno{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.fila-atributo-entreno .badge-prioridad{
  width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:700; flex-shrink:0;
}
.fila-atributo-entreno .info{ flex:1; min-width:0; }
.fila-atributo-entreno .nombre{ font-family:'Space Grotesk',sans-serif; font-size:13.5px; font-weight:600; display:flex; justify-content:space-between; margin-bottom:4px; }
.fila-atributo-entreno .track{ width:100%; height:8px; background:rgba(255,255,255,0.08); border-radius:5px; overflow:hidden; }
.fila-atributo-entreno .fill{ height:100%; border-radius:5px; transition:width .5s ease; }
.fila-atributo-entreno .pct{ font-family:'Space Grotesk',sans-serif; font-size:11px; color:var(--ink-soft); }
.selector-prioridad-item{
  display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px;
  border:1px solid var(--line); margin-bottom:8px; cursor:pointer; background:var(--panel);
}
.selector-prioridad-item.elegido{ border-color:var(--gold); background:rgba(212,175,55,0.08); }
.selector-prioridad-item .nombre{ font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; flex:1; }
.selector-prioridad-item .orden{
  width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:700; background:rgba(255,255,255,0.06); color:var(--ink-soft);
}
.selector-prioridad-item.elegido .orden{ background:var(--gold); color:#1a1408; }
h1,h2,h3{ font-family:'Space Grotesk',sans-serif; margin:0 0 12px; font-weight:600; letter-spacing:0; }
.eyebrow{
  font-family:'Space Grotesk',sans-serif;
  font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
  color: var(--gold); margin-bottom:6px;
}
#topbar-root{
  position:fixed; left:0; right:0; top:0; z-index:60;
  background:rgba(20,22,31,0.96); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); padding:env(safe-area-inset-top,0px) 16px 0;
}
.topbar{
  display:flex; justify-content:space-between; align-items:center; position:relative; height:62px; box-sizing:border-box;
  max-width:760px; margin:0 auto; padding:14px 0;
}
.topbar h1{ font-size:24px; font-weight:700; color:var(--ink); text-transform:uppercase; letter-spacing:.02em; }
.logo-wrap{ display:flex; align-items:center; gap:8px; }
.logo-badge{ flex-shrink:0; display:flex; align-items:center; }
.logo-badge svg{ display:block; }
.icono-insignia{
  border-radius:50%; flex-shrink:0;
  background: radial-gradient(circle at 35% 30%, #262B3C, #14161F 75%);
  border:1.3px solid var(--gold); color:var(--gold);
  display:flex; align-items:center; justify-content:center;
}
.icono-insignia svg{ width:58%; height:58%; }
.icono-inline svg{ width:100%; height:100%; }
.logo-text{ display:flex; align-items:baseline; }
.logo-text .top{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; letter-spacing:.02em; color:var(--gold); }
.logo-text .main{
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; letter-spacing:.02em;
  color:var(--ink); margin-left:4px;
}
.card{
  background: var(--panel);
  color: var(--ink);
  border-radius: 14px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  padding: 26px 24px;
  margin-bottom: 18px;
}

/* ---- creación de personaje ---- */
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-soft); margin-bottom:6px; font-family:'Space Grotesk',sans-serif; }
.field input[type=text], .field select{
  width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line);
  background: var(--bg2); font-family:'Space Grotesk',sans-serif; font-size:15px; color:var(--ink);
}
.field input[type=text]:focus{ outline:none; border-color:var(--gold); }
.field input[type=text]:disabled{ opacity:.55; cursor:not-allowed; }
.field-row{ display:flex; gap:12px; margin-bottom:16px; }
.field-row .field{ flex:1; min-width:0; margin-bottom:0; }
.field-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:5px; }
.points-header{ display:flex; justify-content:space-between; align-items:center; margin:20px 0 12px; }
.attr-row button{
  width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:var(--bg2);
  cursor:pointer; font-size:14px; line-height:1; color:var(--ink);
}
.attr-row button:disabled{ opacity:.3; cursor:not-allowed; }

.btn-main{
  width:100%; padding:14px; border-radius:10px; border:none; margin-top:8px;
  background: var(--gold);
  color:#191507; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;
  letter-spacing:.01em; cursor:pointer;
}
.btn-main:disabled{ background:#3E4152; color:#787D8F; cursor:not-allowed; }
.btn-main:not(:disabled):hover{ background:#E0BE49; }
.btn-secondary{
  width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); margin-top:8px;
  background:transparent; color:var(--ink-soft); font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px;
  cursor:pointer;
}
.btn-secondary:hover{ border-color:var(--gold); color:var(--ink); }
.btn-secondary:disabled{ opacity:.35; cursor:not-allowed; }

/* ---- cromo del jugador (carné) ---- */
.cromo{
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px 20px 16px;
  box-shadow: var(--shadow);
  position: relative;
  margin-bottom: 18px;
}
.cromo-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:12px; }
.cromo-avatar{
  width:64px; height:64px; border-radius:12px; flex-shrink:0;
  background: linear-gradient(160deg, #363C50, #262A38);
  border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
}
.cromo-avatar svg{ width:38px; height:38px; }
.cromo-id{ flex:1; }
.cromo-name{ font-size:18px; font-weight:600; color:var(--ink); line-height:1.15; font-family:'Space Grotesk',sans-serif; letter-spacing:0; }
.cromo-club-row{ display:flex; align-items:center; gap:7px; margin-top:6px; font-family:'Space Grotesk',sans-serif; font-size:12.5px; color:var(--ink-soft); }
.cromo-liga-row{ font-family:'Space Grotesk',sans-serif; font-size:10.5px; color:var(--gold-dim); margin-top:2px; margin-left:26px; text-transform:uppercase; letter-spacing:.04em; }
.cromo-club-nombre{ color:var(--ink); font-weight:600; }
.cromo-info-bar{ display:flex; justify-content:space-between; gap:8px; margin:12px 0 14px; padding:10px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.cromo-info-bar .item{ display:flex; flex-direction:column; align-items:center; flex:1; text-align:center; }
.cromo-info-bar .k{ font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:3px; }
.cromo-info-bar .v{ font-size:12.5px; font-weight:600; color:var(--ink); }
.historial-temporadas{ margin-top:4px; }
.historial-club-header{ font-size:11px; font-weight:700; color:var(--ink); text-transform:uppercase; letter-spacing:.02em; margin:12px 0 4px; }
.historial-club-header:first-child{ margin-top:2px; }
.historial-fila{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,0.08); }
.historial-fila .temp{ color:var(--gold-dim); font-size:11px; font-weight:700; flex-shrink:0; }
.historial-fila-stats{ display:flex; justify-content:flex-end; align-items:baseline; gap:10px; font-size:12px; flex-wrap:wrap; }
.historial-fila-stats .dato{ color:var(--ink); font-family:'Space Grotesk',sans-serif; min-width:26px; text-align:right; }
.historial-fila-stats .dato.nota{ color:var(--steel); font-weight:700; }
.historial-fila-stats .dato.oro{ color:var(--gold); font-weight:700; }
.historial-fila.total{ border-bottom:none; border-top:1px solid var(--line); margin-top:6px; padding-top:10px; }
.historial-fila.total .temp{ color:var(--gold); font-size:12.5px; }
.historial-fila.total .dato{ color:var(--gold); font-weight:700; }
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin-top:10px; }
.stat-grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px 10px; }
.stat-grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; }
.estado-item{ text-align:center; padding:6px 3px; background:rgba(255,255,255,0.03); border-radius:8px; }
.estado-item .k{ font-family:'Space Grotesk',sans-serif; font-size:9px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:3px; }
.estado-item .v{ font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:13px; line-height:1.15; color:var(--ink); }
.estado-item .v.ok{ color:var(--green); }
.estado-item .v.warn{ color:var(--gold-dim); }
.estado-item .v.bad{ color:var(--red); }
.carino-seg{ display:flex; gap:2px; margin:6px 6px 2px; }
.carino-seg .seg{ flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,0.08); }
.stat-section{ margin-top:16px; }
.stat-section:first-of-type{ margin-top:0; }
.stat-section-titulo{ font-family:'Space Grotesk',sans-serif; font-size:10px; letter-spacing:.08em; color:var(--gold-dim); margin-bottom:8px; }
.stat-section-titulo.plegable{ position:relative; display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; padding:6px 0; }
.stat-section-titulo.plegable:hover .titulo-texto{ color:var(--gold); }
.titulo-linea{ flex:1; height:1px; background:var(--line); }
.titulo-texto{ white-space:nowrap; }
.flecha-acordeon{ position:absolute; right:0; top:50%; transform:translateY(-50%); font-size:14px; font-weight:700; color:var(--gold); background:var(--panel2); padding-left:6px; }
.stat-mini{ display:flex; justify-content:space-between; font-size:12px; padding:4px 0; border-bottom:1px dashed rgba(255,255,255,0.1); }
.stat-mini .k{ color:var(--ink-soft); }
.stat-mini .v{ font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--ink); }
.hex-chart-wrap{ width:100%; }
.attr-flex{ display:flex; align-items:center; gap:10px; }
.attr-hex-col{ flex:0 0 44%; }
.attr-lista-col{ flex:1; display:flex; flex-direction:column; justify-content:space-between; align-self:stretch; padding:2px 0; }
.attr-lista-row{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; padding:3px 0; border-bottom:1px dashed rgba(255,255,255,0.08); }
.attr-lista-row .nombre{ color:var(--ink-soft); }
.attr-lista-row .valor{ color:var(--ink); font-family:'Space Grotesk',sans-serif; font-weight:600; }
.valor-max{ color:var(--ink-soft); font-weight:500; opacity:0.6; }
.attr-lista-row.total{ border-bottom:none; border-top:1px solid var(--line); margin-top:2px; padding-top:6px; }
.attr-lista-row.total .nombre, .attr-lista-row.total .valor{ color:var(--gold); font-weight:700; }
.hex-labels{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px; fill:var(--gold); letter-spacing:.03em; }
.hex-tooltip-box{
  max-width:280px; margin:12px auto 0; background:var(--bg2); border:1px solid var(--gold); border-radius:10px;
  padding:10px 12px; font-family:'Space Grotesk',sans-serif; font-size:12.5px; line-height:1.4; color:var(--ink);
}
.hex-tooltip-box b{ color:var(--gold); font-family:'Space Grotesk',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }

.objetos-fila{ display:flex; gap:14px; flex-wrap:wrap; padding:4px 0; justify-content:center; }
.objeto-icono{ position:relative; display:flex; flex-direction:column; align-items:center; cursor:pointer; opacity:0.85; transition:opacity .15s; }
.objeto-icono:hover{ opacity:1; }
.objeto-icono.sel .icono-insignia{ border-color:var(--ink); box-shadow:0 0 0 2px rgba(255,255,255,0.15); }
.objeto-icono.malo .icono-insignia{ border-color:var(--red); color:var(--red); }
.objeto-cantidad{ position:absolute; bottom:-4px; right:-4px; background:var(--gold); color:#1a1408; font-family:'Space Grotesk',sans-serif; font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:0 3px; }
.objeto-icono.malo .objeto-cantidad{ display:none; }

.badge{
  display:inline-flex; align-items:center; gap:5px; font-family:'Space Grotesk',sans-serif;
  font-size:11px; padding:4px 9px; border-radius:20px; background:rgba(255,255,255,0.06); color:var(--ink-soft); margin-right:6px; margin-top:6px;
}
.badge.risk{ background:rgba(217,73,92,0.14); color:var(--red); }
.badge.token{ background:rgba(212,175,55,0.16); color:var(--gold); }

.animo-badge{ display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:10px; margin-bottom:14px; border:1px solid; font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600; }
.animo-badge .punto{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.animo-badge.contento{ background:rgba(76,175,109,0.1); border-color:rgba(76,175,109,0.35); color:var(--green); }

}

/* ---- fin de temporada / informe de partido ---- */
.press{
  background: var(--panel);
  border:1px solid var(--line);
  border-radius:14px; padding:0; overflow:hidden; box-shadow:var(--shadow); margin-bottom:18px;
}
.press-header{ background: var(--panel2); padding:14px 20px; border-bottom:1px solid var(--line); }
.press-header .eyebrow{ color: var(--gold); }

.press-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }

.press-stat .num{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; color:var(--gold); }

.press-stat-hero{ background:linear-gradient(180deg, rgba(212,175,55,0.14), rgba(212,175,55,0.03)); border:1px solid rgba(212,175,55,0.34); border-radius:10px; padding:15px 6px; text-align:center; }
.press-stat-hero .num{ font-family:'Space Grotesk',sans-serif; font-size:31px; font-weight:700; color:var(--gold); line-height:1; }
.press-stat-hero .lbl{ font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.07em; margin-top:6px; font-family:'Space Grotesk',sans-serif; }
.press-stat-group{ margin-top:16px; }
.press-stat-group .grp-tit{ font-family:'Space Grotesk',sans-serif; font-size:10px; text-transform:uppercase; letter-spacing:.11em; color:var(--gold-dim); margin-bottom:7px; display:flex; align-items:center; }
.press-stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.press-stat.gold .num{ color:var(--gold); }
.press-stat.dim{ opacity:.4; }
.press-stat.dim .num{ color:var(--ink-soft); font-weight:600; }

.club-row{ padding:12px 0; border-bottom:1px solid var(--line); }
.club-row:last-child{ border-bottom:none; }
.club-top{ display:flex; align-items:center; gap:10px; }

.club-nombre{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; text-transform:uppercase; }

.club-stats .stat{ display:flex; flex-direction:column; }

.club-titulos-box{ margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
.titulo-chip{ display:inline-flex; align-items:center; gap:6px; font-family:'Space Grotesk',sans-serif; font-size:11px; color:var(--gold); background:rgba(212,175,55,0.1); border-radius:6px; padding:3px 8px 3px 3px; }
.resumen-total{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); display:flex; justify-content:space-around; text-align:center; flex-wrap:wrap; gap:8px; }

/* ---- fin de carrera: legado personal (subtramas) ---- */
.legado-personal{ margin-top:6px; }
.legado-item{ padding:13px 0; border-bottom:1px solid var(--line); }
.legado-item:first-child{ padding-top:4px; }
.legado-item:last-child{ border-bottom:none; padding-bottom:0; }
.legado-tit{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--gold); margin-bottom:4px; }
.legado-txt{ font-size:13.5px; line-height:1.55; color:var(--ink); }
.legado-cierre{ margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); font-size:12.5px; line-height:1.5; color:var(--ink-soft); font-style:italic; }

/* ---- tutorial de inicio ---- */
.tuto-ilustra{ background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:8px 0 14px; }
.tuto-ilustra svg{ display:block; width:100%; height:auto; }
.tuto-text{ background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:4px;
  font-family:'Space Grotesk',sans-serif; font-size:14.5px; line-height:1.55; color:var(--ink); }
.tuto-dots{ display:flex; justify-content:center; gap:7px; margin:18px 0 26px; }
.tuto-dots i{ width:7px; height:7px; border-radius:50%; background:var(--line); display:block; transition:background .2s; }
.tuto-dots i.on{ background:var(--gold); }

/* ---- resumen de temporada (modal progresivo) ---- */
.resumen-card{ max-width:420px; margin:0 auto; }
.resumen-card .eyebrow{ text-align:center; }
.resumen-card h2{ text-align:center; font-size:22px; margin-bottom:14px; }
.reveal-stats-row{
  display:flex; gap:8px; margin-bottom:6px; opacity:0; transform:translateY(8px);
  transition:opacity .4s ease, transform .4s ease;
}
.reveal-stats-row.show{ opacity:1; transform:translateY(0); }
.reveal-stat-box{ flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 4px; text-align:center; }
.reveal-stat-box .num{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; color:var(--ink); line-height:1; }
.reveal-stat-box .lbl{ font-family:'Space Grotesk',sans-serif; font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-top:4px; }
.reveal-section-title{
  font-family:'Space Grotesk',sans-serif; font-size:10.5px; text-transform:uppercase; letter-spacing:.1em;
  color:var(--gold-dim); margin:16px 0 2px;
}
.reveal-row{
  display:flex; justify-content:space-between; align-items:center; padding:10px 4px;
  border-bottom:1px dashed var(--line); opacity:0; transform:translateY(8px);
  transition:opacity .4s ease, transform .4s ease;
}
.reveal-row.show{ opacity:1; transform:translateY(0); }
.reveal-row .lbl{ font-family:'Space Grotesk',sans-serif; font-size:14px; color:var(--ink-soft); display:flex; align-items:center; gap:7px; }
.reveal-row .val{ font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:700; color:var(--ink); }
.reveal-row .val.small{ font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; }
.reveal-row .val.oro{ color:var(--gold); }
.reveal-nota{
  text-align:center; margin-top:18px; padding-top:16px; border-top:1px solid var(--line);
  opacity:0; transform:scale(.9); transition:opacity .5s ease, transform .5s ease;
}
.reveal-nota.show{ opacity:1; transform:scale(1); }
.reveal-nota .lbl{ font-family:'Space Grotesk',sans-serif; font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
.reveal-nota .num{
  font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; color:#fff; line-height:1;
  display:inline-block; padding:8px 22px; border-radius:12px;
}
.reveal-nota.nota-roja .num{ background:var(--red); }
.reveal-nota.nota-naranja .num{ background:#E0932E; }
.reveal-nota.nota-verde .num{ background:var(--green); }
.reveal-nota.nota-azul .num{ background:#3B82D9; }
.final-reveal-item{ opacity:0; transform:translateY(10px); transition:opacity .5s ease, transform .5s ease; }
.final-reveal-item.show{ opacity:1; transform:translateY(0); }
.resumen-card .btn-main{ opacity:0; pointer-events:none; transition:opacity .4s ease; }
.resumen-card .btn-main.show{ opacity:1; pointer-events:auto; }


/* ---- transiciones (crossfade suave) ---- */
@keyframes fadeIn{ 0%{opacity:0; transform:translateY(10px) scale(.99);} 100%{opacity:1; transform:translateY(0) scale(1);} }
@keyframes fadeOut{ 0%{opacity:1; transform:translateY(0) scale(1);} 100%{opacity:0; transform:translateY(-6px) scale(.99);} }
@keyframes balonOroBurst{ 0%{ transform:scale(0.3) rotate(-15deg); opacity:0; } 55%{ transform:scale(1.25) rotate(6deg); opacity:1; } 100%{ transform:scale(1) rotate(0deg); opacity:1; } }
@keyframes balonOroPulso{ 0%,100%{ box-shadow:0 0 0 rgba(212,175,55,0); } 50%{ box-shadow:0 0 45px rgba(212,175,55,0.55); } }
.balon-oro-ganador{ animation:balonOroPulso 1.8s ease-in-out infinite; border-color:var(--gold) !important; }
.balon-oro-trofeo{ display:flex; justify-content:center; margin:14px 0; opacity:0; }
.balon-oro-trofeo.show{ opacity:1; animation:balonOroBurst .7s cubic-bezier(.34,1.56,.64,1); }
#app.fade-in{ animation: fadeIn .7s cubic-bezier(.16,1,.3,1); }
#app.fade-out{ animation: fadeOut .28s cubic-bezier(.4,0,1,1) forwards; }

/* ---- tirada de dados ---- */
.dice-scene{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:36px 10px 22px; }
.die{
  width:84px; height:84px; background: var(--panel2); color:var(--ink);
  display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif;
  font-size:32px; font-weight:700; box-shadow:0 8px 18px rgba(0,0,0,0.4); border:1px solid var(--line);
  clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
  transition: transform .12s ease;
}
.die.settled{ background: var(--gold); color:#191507; border-color:var(--gold); }
.die.natural{ background:#EAC94F; box-shadow:0 0 22px rgba(212,175,55,.55); }
.die.maldeojo{ background:#5A1F2B; box-shadow:0 0 22px rgba(217,73,92,.55); color:#fff; }
.dice-need{ margin-bottom:14px; font-family:'Space Grotesk',sans-serif; font-size:14px; color:var(--ink-soft); text-align:center; }
.dice-need b{ color:var(--gold); font-size:17px; font-family:'Space Grotesk',sans-serif; font-weight:700; }
.dice-suma{ margin-top:10px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; color:var(--ink); text-align:center; opacity:0; transform:translateY(-4px); transition:opacity .3s ease, transform .3s ease; }
.dice-suma.show{ opacity:1; transform:translateY(0); }
.dice-caption{ margin-top:16px; font-family:'Space Grotesk',sans-serif; font-size:12px; color:var(--ink-soft); text-align:center; }
.roll-result{
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:36px; letter-spacing:0;
  margin-top:18px; opacity:0; transform:translateY(6px); transition: opacity .35s ease, transform .35s ease;
}
.roll-result.show{ opacity:1; transform:translateY(0); }
.roll-result.exito{ color:var(--green); }
.roll-result.fallo{ color:var(--red); }

/* ---- reveal a pantalla completa (temporada / ascenso / campeón) ---- */
.season-reveal{ text-align:center; padding-top:8px; }
.season-reveal .lbl{ font-family:'Space Grotesk',sans-serif; letter-spacing:.25em; text-transform:uppercase; font-size:12px; color:var(--ink-soft); margin-bottom:10px; }
.season-reveal .num{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:68px; color:var(--gold); line-height:1; }
.season-reveal .num.small{ font-size:28px; text-transform:uppercase; letter-spacing:.03em; }
.season-reveal .objetivo{ margin-top:10px; font-family:'Space Grotesk',sans-serif; font-size:11.5px; color:var(--ink-soft); }
.season-reveal .objetivo b{ color:var(--gold); font-weight:700; }
.season-reveal.campeon .num{ color:var(--gold); }
.season-reveal .sub{ margin-top:14px; font-size:15px; color:var(--ink-soft); max-width:420px; }
.season-reveal .btn-main{ margin-top:26px; max-width:260px; }
.season-reveal .icon{ font-size:50px; margin-bottom:6px; }

.clasificacion-card{ text-align:center; }
.clasificacion-titulo{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:26px; color:var(--ink); margin:4px 0 10px; }
.clasificacion-sub{ font-size:14px; color:var(--ink-soft); margin-bottom:18px; }

/* ---- ofertas ---- */
.oferta-card{
  border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px; background:var(--bg2);
}
.oferta-card.elite{
  border-color:rgba(212,175,55,0.55);
}
.oferta-club{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; }
.oferta-meta{ font-family:'Space Grotesk',sans-serif; font-size:11px; color:var(--ink-soft); margin:4px 0 10px; }
.oferta-lista{ list-style:none; margin:6px 0 12px; padding:0; }
.oferta-lista li{
  display:flex; justify-content:space-between; gap:10px; padding:6px 0;
  border-bottom:1px solid var(--line); font-family:'Space Grotesk',sans-serif; font-size:12.5px;
}
.oferta-lista li:last-child{ border-bottom:none; }
.oferta-lista li .k{ color:var(--ink-soft); }
.oferta-lista li .v{ color:var(--ink); font-weight:600; text-align:right; }
.oferta-card .btn-main{ margin-top:0; padding:10px; font-size:14px; }

/* ---- entrenamiento (checkpoints) ---- */
.lore-box{
  background: rgba(110,136,168,0.1); border-left:4px solid var(--steel); border-radius:8px; padding:14px 16px; margin-bottom:18px;
  font-family:'Space Grotesk',sans-serif; font-size:14.5px; line-height:1.55; color:var(--ink);
}
.train-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
.train-btn{
  border:1px solid var(--line); border-radius:10px; padding:14px 10px; text-align:center; background:var(--bg2); cursor:pointer;
  transition: border-color .15s;
}
.train-btn:hover{ border-color:var(--gold); }
.train-btn .ic{ display:flex; justify-content:center; }
.train-btn .nm{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; margin-top:4px; text-transform:uppercase; }
.train-btn .vl{ font-family:'Space Grotesk',sans-serif; font-size:12px; color:var(--gold); margin-top:2px; }

/* ---- tienda / gastos ---- */
.tienda-item{
  display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:9px; padding:9px 12px; margin-bottom:7px; background:var(--bg2);
}
.tienda-item .ic{ flex-shrink:0; }
.tienda-item .info{ flex:1; min-width:0; }
.tienda-item .nm{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; text-transform:uppercase; line-height:1.2; }
.tienda-item .ds{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
.tienda-efectos{ display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
.tienda-accion{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
.tienda-item .coste{ font-family:'Space Grotesk',sans-serif; font-size:11.5px; color:var(--gold); font-weight:700; white-space:nowrap; }
.tienda-item button{
  border:none; border-radius:7px; padding:7px 11px; background:var(--gold); color:#191507;
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap;
}
.tienda-item button:disabled{ background:#3E4152; color:#787D8F; cursor:not-allowed; }
.servicio-fila{ padding:12px 0; border-bottom:1px solid var(--line); }
.servicio-fila:last-child{ border-bottom:none; }
.servicio-cab{ display:flex; align-items:center; gap:9px; margin-bottom:9px; }
.servicio-nombre{ font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; color:var(--ink); flex:1; }
.servicio-activo-tag{ font-family:'Space Grotesk',sans-serif; font-size:10px; font-weight:700; color:var(--green); white-space:nowrap; }
.servicio-niveles{ display:flex; gap:6px; }
.servicio-nivel-btn{
  flex:1; text-align:center; padding:7px 4px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg2); cursor:pointer; font-family:'Space Grotesk',sans-serif; transition:border-color .15s,background .15s;
}
.servicio-nivel-btn .n{ font-size:11px; font-weight:700; color:var(--ink-soft); }
.servicio-nivel-btn .c{ font-size:9.5px; color:var(--ink-soft); margin-top:2px; }
.servicio-nivel-btn.activo{ border-color:var(--gold); background:rgba(212,175,55,0.12); }
.servicio-nivel-btn.activo .n, .servicio-nivel-btn.activo .c{ color:var(--gold); }
.servicio-nivel-btn.inasequible{ opacity:.4; cursor:not-allowed; }
.servicio-desc{ font-family:'Space Grotesk',sans-serif; font-size:11.5px; color:var(--ink-soft); margin-top:8px; line-height:1.5; }

function primerEquipoDeFilial(nombreClub){
  const directo = Object.keys(FILIAL_DE_CLUB).find(primero => FILIAL_DE_CLUB[primero] === nombreClub);
  if(directo) return directo;
  const match = nombreClub.match(/^(.+?)\s+[BC]$/);
  if(!match) return null;
  const PREFIJOS_GENERICOS = ['CD','CF','UD','SD','RC','RCD','AD','UE','CA','Real','Club','Athletic','Deportivo'];
  const palabras = match[1].trim().split(' ');
  while(palabras.length > 1 && PREFIJOS_GENERICOS.includes(palabras[0])) palabras.shift();
  const palabraClave = palabras[0];
  if(!palabraClave || palabraClave.length < 4) return null;
  const todosLosClubes = Object.values(CLUBES_POR_CATEGORIA).flat().map(c=>c.nombre);
  const candidato = todosLosClubes.find(n => n !== nombreClub && n.includes(palabraClave));
  return candidato || null;
}

function logoMarca(nombre, tamano, colores){
  tamano = tamano || 30;
  let primario = (colores && colores[0]) || colorDesdeTexto(nombre);
  // Un color de marca casi negro (Nike, Adidas...) se pierde sobre el fondo oscuro del juego:
  // por debajo de este umbral de luminancia se sustituye por un gris claro legible.
  const c = primario.replace('#','');
  const r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
  const luminancia = (r*299 + g*587 + b*114) / 1000;
  if(luminancia < 70) primario = '#EEEFF3';
  const sector = SECTOR_MARCA[nombre] || 'industrial';
  const trazos = ICONOS_SECTOR_MARCA[sector] || ICONOS_SECTOR_MARCA.industrial;
  return `<svg width="${tamano}" height="${tamano}" viewBox="0 0 24 24">
    <g fill="none" stroke="${primario}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${trazos}</g>
  </svg>`;
}

  const m = {};

// Todos son rivales plausibles en semis de un torneo grande, pero no todos igual de habituales:
// las selecciones históricamente más fuertes pesan algo más al elegir semifinal/final.
const POTENCIA_SELECCION = {
  "Francia":3, "Alemania":3, "Inglaterra":3, "Brasil":3, "Argentina":3,
  "Italia":2.2, "Portugal":2.2, "Países Bajos":2, "Bélgica":2, "Uruguay":1.8, "Croacia":1.8,
  "México":1.2, "Turquía":1, "Escocia":1, "Suiza":1, "Grecia":1
};
function elegirRivalesSeleccion(pool){
  const disponibles = [...pool];
  const elegir = () => {
    const pesoTotal = disponibles.reduce((s,pais)=> s+(POTENCIA_SELECCION[pais]||1), 0);
    let dado = Math.random()*pesoTotal;
    for(let i=0;i<disponibles.length;i++){
      dado -= (POTENCIA_SELECCION[disponibles[i]]||1);
      if(dado <= 0){ const [pais] = disponibles.splice(i,1); return pais; }
    }
    return disponibles.pop();
  };
  const semi = elegir();
  const final = elegir();
  return [semi, final];
}

// Cuánto multiplica tu nota media de la temporada pasada (j.ultimaNotaTemporada) la
// probabilidad de tu equipo. Más franjas que un simple lineal, y calibrado para que el 8-10
// habitual de quien juega competición europea siga teniendo recorrido dentro de la escala.
function multiplicadorPorNota(nota){
  if(nota < 5.5) return 0.70;  // floja
  if(nota < 6.5) return 0.85;  // normalita
  if(nota < 7.5) return 1.00;  // correcta (referencia neutra)
  if(nota < 8.5) return 1.20;  // buena
  if(nota < 9.3) return 1.50;  // notable / de los mejores de la liga
  return 1.90;                 // descomunal / candidato a Balón de Oro
}
// Un crack de verdad arrastra mucho más a un equipo modesto (donde el resto de la plantilla es
// floja y tu aportación pesa proporcionalmente más) que a un equipo ya lleno de buenos
// jugadores. nivelEquipo va de 0 (equipo humilde) a 1 (equipo top).
function factorJugadorEstrella(j, nivelEquipo){
  const nota = j.ultimaNotaTemporada != null ? j.ultimaNotaTemporada : 6.5;
  const desviacion = multiplicadorPorNota(nota) - 1; // -0.30 .. +0.90
  const intensidad = 1.8 - nivelEquipo * 1.3; // equipo humilde → x1.8 · equipo top → x0.5
  return 1 + desviacion * intensidad;
}
// "Tamaño" del club para la Copa del Rey: categoría + prestigio dentro de esa categoría.
function nivelEquipoDomestico(j){
  const idxCat = CATEGORIAS.indexOf(j.club.categoria);
  const prestigio = PRESTIGIO_CLUB[j.club.nombre] || 2;
  return idxCat >= 4 ? (0.55 + (prestigio-1)/3*0.45)   // LaLiga
    : idxCat === 3 ? (0.25 + (prestigio-1)/3*0.25)      // LaLiga2
    : ((prestigio-1)/3*0.2);                            // Primera RFEF
}
// "Tamaño" del club para competiciones internacionales: prestigio + qué tan fuerte es su liga.
function nivelEquipoInternacional(j){
  const prestigio = PRESTIGIO_CLUB[j.club.nombre] || 2;
  const pais = j.club.extranjero ? j.club.pais : 'España';
  const factorLiga = FACTOR_LIGA_PAIS[pais] ?? 0.25;
  return Math.max(0, Math.min(1, ((prestigio-1)/3 * 0.5) + ((factorLiga-0.25)/0.75) * 0.5));
}
// Probabilidad de llegar a semis de una competición continental, YA clasificado para ella
// (eso ya filtra mucho: solo entran los puestos altos de tu liga). Ni siquiera los grandes
// llegan a semis todos los años — el prestigio del club mueve una base que refleja lo exigente
// que es cada competición en la vida real. La posición en liga (el único baremo que tenemos de
// cómo va tu equipo ESA temporada), la liga de tu país, y tu propia nota media de crack (o de
// jugador flojo) terminan de matizar esa base.
function probabilidadSemisContinental(j, baseCompeticion){
  const prestigio = PRESTIGIO_CLUB[j.club.nombre] || 2; // 1-4, relativo a SU PROPIO país
  const factorPrestigio = prestigio / 2.5; // 1→0.4 · 2,5 (neutro)→1.0 · 4→1.6
  const posicion = S.posicionLiga || Math.ceil(EQUIPOS_EN_LIGA/2);
  const factorPosicion = 1.8 - (posicion-1)/(EQUIPOS_EN_LIGA-1) * 1.5; // 1º→1.8 · último→0.3
  const factorForma = (factorPrestigio + factorPosicion) / 2;
  const pais = j.club.extranjero ? j.club.pais : 'España';
  const factorLiga = FACTOR_LIGA_PAIS[pais] ?? 0.25; // el prestigio no vale lo mismo en cualquier liga
  const factorEstrella = factorJugadorEstrella(j, nivelEquipoInternacional(j));
  return Math.max(0.003, baseCompeticion * factorForma * factorLiga * factorEstrella);
}

/* ============================================================
   LÓGICA Y PANTALLAS DEL JUEGO
   ============================================================ */

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function capitalizarNombre(nombre){ return nombre.split(' ').map(p=> p ? cap(p.toLowerCase()) : p).join(' '); }
function textoCambioStat(clave, delta){
  if(!STATS_SIN_NUMERO_VISIBLE.includes(clave)) return formatearDelta(clave, delta);
  const flecha = delta>=0 ? '↑' : '↓';
  return Math.abs(delta) >= 8 ? flecha+flecha : flecha;
}
function formatearNumero(valor, decimales){
  return valor.toFixed(decimales===undefined?1:decimales).replace('.', ',');
}
function formatearDinero(valor){
  const neg = valor < 0;
  const abs = Math.abs(valor);
  let texto;
  if(abs >= 1000000){
    texto = (abs/1000000).toFixed(1).replace('.0','').replace('.',',') + 'M';
  } else if(abs >= 1000){
    texto = (abs/1000).toFixed(1).replace('.0','').replace('.',',') + 'K';
  } else {
    texto = abs.toLocaleString('es-ES');
  }
  return (neg?'-':'') + texto + ' €';
}
function formatearDelta(clave, delta){
  const signo = delta>=0 ? '+' : '';
  if(clave==='dinero' || clave==='valorMercado'){
    return `${signo}${formatearDinero(delta)}`;
  }
  return `${signo}${delta}`;
}
function nivelActual(valor, niveles){
  let resultado = niveles[0], idx = 0;
  niveles.forEach((n,i)=>{ if(valor >= n.min){ resultado = n; idx = i; } });
  return { ...resultado, idx, total: niveles.length, esMaximo: idx === niveles.length-1 };
}
// Gradiente limpio de rojo a verde (pasando por naranja y amarillo), vía tono HSL
function colorEnGradiente(pos){
  pos = Math.max(0, Math.min(1, pos));
  const tono = pos * 120; // 0 = rojo, 120 = verde
  return `hsl(${tono}, 62%, 48%)`;
}
function estadoSalud(valor){ return nivelActual(valor, NIVELES_SALUD); }
function estadoForma(valor){ return nivelActual(valor, NIVELES_FORMA); }
function estadoConfianza(valor){ return nivelActual(valor, NIVELES_CONFIANZA); }
function estadoReputacion(valor){ return nivelActual(valor, NIVELES_REPUTACION); }
function estadoPopularidad(valor){ return nivelActual(valor, NIVELES_POPULARIDAD); }
function estadoVestuario(valor){ return nivelActual(valor, NIVELES_VESTUARIO); }
function estadoCarino(valor){ return nivelActual(valor, NIVELES_CARINO); }
function estadoPareja(valor){ return nivelActual(valor, NIVELES_PAREJA); }
function resolverTexto(valor, jugador){ return typeof valor === 'function' ? valor(jugador) : valor; }
function conColores(nombres, offset){
  return nombres.map((nombre,i)=> ({ nombre, colores: PALETA_COLORES_CLUB[(i+(offset||0)) % PALETA_COLORES_CLUB.length] }));
}
function clubAleatorio(categoria, excluir){
  const opciones = CLUBES_POR_CATEGORIA[categoria].filter(c => c.nombre !== excluir);
  return opciones[Math.floor(Math.random()*opciones.length)];
}
function articuloClub(nombre){
  if(!nombre) return 'el';
  if(/^UD /.test(nombre) || /^SD /.test(nombre) || /^UE /.test(nombre) || /^Real Sociedad/.test(nombre)) return 'la';
  return 'el';
}
function articuloCompeticion(nombre){
  if(!nombre) return 'la';
  return COMPETICIONES_MASCULINAS.includes(nombre) ? 'el' : 'la';
}
function coloresDeClub(nombre, categoria){
  const entrada = (CLUBES_POR_CATEGORIA[categoria]||[]).find(c=>c.nombre===nombre);
  return entrada ? entrada.colores : null;

function ambicionInicial(nombreClub){

function evolucionarRival(j){
  const rival = j.rival;
  if(!rival.trayectoriaIniciada) return;
  // Tras el prólogo el rival no se queda en el limbo: la temporada siguiente ficha sí o sí,
  // por un club de tu misma categoría de arranque (era el que mejor jugaba de todos).
  if(!rival.club){
    const libres = (CLUBES_POR_CATEGORIA['Tercera RFEF']||[]).filter(c =>
      c.nombre !== j.club.nombre && !primerEquipoDeFilial(c.nombre) && !j.companeros.some(cm=>cm.club===c.nombre));
    const pool = libres.length ? libres : (CLUBES_POR_CATEGORIA['Tercera RFEF']||[]).filter(c=>c.nombre!==j.club.nombre);
    if(pool.length){
      const e = pool[Math.floor(Math.random()*pool.length)];
      rival.club = e.nombre; rival.colores = e.colores; rival.categoria = 'Tercera RFEF';
    }
    return; // ese año solo se coloca; la progresión arranca la temporada siguiente
  }
  const cambio = Math.random();
  if(cambio < 0.32) rival.nivel = Math.min(4, rival.nivel + 1);
  else if(cambio < 0.52) rival.nivel = Math.max(1, rival.nivel - 1);
  if(Math.random() < 0.10 + rival.nivel*0.04) rival.titulos = (rival.titulos||0) + 1;
  if(rival.nivel === 4 && Math.random() < 0.06) rival.balonesDeOro = (rival.balonesDeOro||0) + 1;
  // mientras comparta vestuario contigo no se mueve de club: eso lo resuelve el evento "uno de los dos sobra"
  if(!rival.compartiendoVestuario && Math.random() < 0.35){
    const CATEGORIA_POR_NIVEL_RIVAL = { 1:'Segunda RFEF', 2:'Primera RFEF', 3:'LaLiga2', 4:'LaLiga' };
    const nuevaCategoria = CATEGORIA_POR_NIVEL_RIVAL[rival.nivel];
    const candidatos = (CLUBES_POR_CATEGORIA[nuevaCategoria]||[]).filter(c => !primerEquipoDeFilial(c.nombre));
    if(candidatos.length){
      const elegido = candidatos[Math.floor(Math.random()*candidatos.length)];
      rival.club = elegido.nombre; rival.colores = elegido.colores; rival.categoria = nuevaCategoria;
    }
  }
  rival.relacion = Math.max(-100, Math.min(100, rival.relacion));
}
// Progresión modesta de los compañeros de cantera: suben de categoría hasta su techo
// (nunca LaLiga — eso queda para ti y para Adrián), a veces bajan o cambian de club, y con
// la edad se retiran. No se tocan si comparten club contigo (eso lo maneja el reencuentro).
function evolucionarCompaneros(j){
  const TOPE_GENERAL = CATEGORIAS.indexOf('LaLiga2');
  j.companeros.forEach(cmp=>{
    if(cmp.retirado || !cmp.club) return;
    if(cmp.club === j.club.nombre){ cmp.juntosActualmente = true; return; }
    if(j.edad >= 34 && Math.random() < 0.15 + (j.edad-34)*0.08){
      cmp.retirado = true; cmp.juntosActualmente = false; return;
    }
    const idxActual = Math.max(0, CATEGORIAS.indexOf(cmp.categoria || 'Tercera RFEF'));
    const idxTecho = Math.min(TOPE_GENERAL, CATEGORIAS.indexOf(cmp.techo || 'Segunda RFEF'));
    const r = Math.random();
    let nuevaCategoria = null;
    if(idxActual < idxTecho && r < 0.20) nuevaCategoria = CATEGORIAS[idxActual + 1];
    else if(idxActual > 0 && r > 0.92) nuevaCategoria = CATEGORIAS[idxActual - 1];
    if(nuevaCategoria){
      const destino = clubAleatorio(nuevaCategoria, cmp.club);
      cmp.categoria = nuevaCategoria; cmp.club = destino.nombre; cmp.colores = destino.colores;
    } else if(idxActual > 0 && r > 0.82){
      const destino = clubAleatorio(cmp.categoria, cmp.club); // cambia de aires sin cambiar de división
      cmp.club = destino.nombre; cmp.colores = destino.colores;
    }
    cmp.nivel = Math.max(1, CATEGORIAS.indexOf(cmp.categoria || 'Tercera RFEF') + 1);
    cmp.juntosActualmente = (cmp.club === j.club.nombre);
  });
}

function despedirRivalDeTuClub(j){
  j.rival.compartiendoVestuario = false;
  j.rival.temporadasCompartiendo = 0;
  j.rival.yaCompartioVestuario = true;
  j.rival.juntosActualmente = false;
  const CAT_POR_NIVEL = { 1:'Segunda RFEF', 2:'Primera RFEF', 3:'LaLiga2', 4:'LaLiga' };
  const cat = CAT_POR_NIVEL[j.rival.nivel] || 'Primera RFEF';
  const destino = clubAleatorio(cat, j.club.nombre);
  j.rival.club = destino.nombre; j.rival.colores = destino.colores; j.rival.categoria = cat;
  return destino;
}

/* Escudos "a medida" de los clubes top del juego (CLUBES_GRANDES) y de los de prestigio 4
   que no son "grandes". Son interpretaciones propias construidas con primitivas heráldicas
   genéricas (contorno de escudo, franjas, bandas) + los colores del club + siglas. NO
   reproducen los emblemas oficiales: sin cruces, coronas, monogramas, animales ni
   composiciones concretas de los escudos reales. Usan el mismo contorno de escudo que el
   resto del juego (FORMA_ESCUDO_ESTANDAR, la misma que escudoSVG dibuja para LaLiga y el
   resto de clubes) para que no desentonen visualmente con los demás. */
const FORMA_ESCUDO_ESTANDAR = 'M20 2 L37 8 V22 C37 33 30 40 20 43 C10 40 3 33 3 22 V8 Z';
const FORMA_ESCUDO_RECTO = 'M4 2 L36 2 L36 21 C36 32 29 40 20 43 C11 40 4 32 4 21 Z';
const FORMA_TRIANGULO = 'M1 11 L39 11 L20 43 Z';
const FORMA_ROMBO = 'M20 2 L37 22 L20 43 L3 22 Z';
const FORMA_CUADRADO_PICO = 'M4 2 L36 2 L36 30 L20 43 L4 30 Z';
// Silueta general del escudo: 'escudo' (apuntado), 'escudo_recto' (borde superior recto,
// como la mayoría de escudos de fútbol reales), 'circulo', 'ovalo', 'triangulo' (punta
// abajo), 'rombo' o 'cuadrado_pico' (cuerpo recto que remata en punta abajo) — solo la
// categoría geométrica gruesa de cada club real, nunca su contorno exacto ni ningún
// detalle del emblema.
function formaEscudoElemento(forma){
  if(forma === 'circulo') return '<circle cx="20" cy="21" r="19"/>';
  if(forma === 'ovalo') return '<ellipse cx="20" cy="22" rx="17.5" ry="21"/>';
  if(forma === 'escudo_recto') return `<path d="${FORMA_ESCUDO_RECTO}"/>`;
  if(forma === 'triangulo') return `<path d="${FORMA_TRIANGULO}"/>`;
  if(forma === 'rombo') return `<path d="${FORMA_ROMBO}"/>`;
  if(forma === 'cuadrado_pico') return `<path d="${FORMA_CUADRADO_PICO}"/>`;
  return `<path d="${FORMA_ESCUDO_ESTANDAR}"/>`;
}
function envolverEscudo(tamano, clipId, contenido, sigla, colorSigla, strokeSigla, tamSigla, forma, extra){

function esColorClaro(hex){
  if(!hex) return false;
  const c = hex.replace('#','');
  const r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
  return (r*299 + g*587 + b*114) / 1000 > 165;
}

}

function migrarJugadorGuardado(j){
  if(!j) return;
  j.stats = j.stats || {};
  if(j.stats.felicidadPareja === undefined) j.stats.felicidadPareja = 0;
  j.objetos = j.objetos || {};
  if(j.objetos.inspiracion === undefined) j.objetos.inspiracion = 0;
  if(j.objetos.avalNegociacion === undefined) j.objetos.avalNegociacion = 0;
  if(j.objetos.segundaOportunidad === undefined) j.objetos.segundaOportunidad = 0;
  if(j.objetos.vestuario === undefined) j.objetos.vestuario = 0;
  if(j.objetos.confianzaCiega === undefined) j.objetos.confianzaCiega = 0;
  if(j.stats.vestuario === undefined) j.stats.vestuario = 55;
  if(j.estadoMental === undefined) j.estadoMental = 'normal';
  if(j.rachaResultados === undefined) j.rachaResultados = 0;
  if(j.promesasActivas === undefined) j.promesasActivas = [];
  if(j.promesasIncumplidas === undefined) j.promesasIncumplidas = 0;
  if(j.prioridadesEntreno === undefined) j.prioridadesEntreno = [];
  if(j.suscripciones === undefined) j.suscripciones = {};
  if(j.rachaGafada === undefined) j.rachaGafada = !!j.malDeOjo;
  if(j.enFilial === undefined) j.enFilial = false;
  if(j.tienePareja === undefined) j.tienePareja = false;
  if(j.titulosSeleccion === undefined) j.titulosSeleccion = [];
  if(j.historialSeleccion === undefined) j.historialSeleccion = [];
  j.carrera = j.carrera || {};
  if(j.carrera.partidosSeleccion === undefined) j.carrera.partidosSeleccion = 0;
  if(j.carrera.golesSeleccion === undefined) j.carrera.golesSeleccion = 0;
  if(j.carrera.asistenciasSeleccion === undefined) j.carrera.asistenciasSeleccion = 0;
  if(j.historialCompras === undefined) j.historialCompras = [];
  if(j.clubesEnfriados === undefined) j.clubesEnfriados = {};
  if(j.representante === undefined) j.representante = null;
  if(j.temporadasEnClub === undefined) j.temporadasEnClub = 0;
  if(j.temporadasSinEquipo === undefined) j.temporadasSinEquipo = [];
  if(j.enParo === undefined) j.enParo = false;
  if(j.contrato && j.contrato.duracionOriginal == null) j.contrato.duracionOriginal = j.contrato.duracionTemporadas;
  if(j.tienePareja && !j.pareja) j.pareja = generarNombrePareja(); // reconcilia desincronía legacy pareja/tienePareja
  // Arreglo retroactivo: partidas viejas podían tener a la madre con el primer apellido del jugador.
  if(j.padreMadre && j.padreMadre.genero === 'f'){
    const apJugador = (j.nombre||'').trim().split(' ').slice(1).join(' ');
    if(apJugador && typeof j.padreMadre.nombre === 'string' && j.padreMadre.nombre.endsWith(' ' + apJugador)){
      const nuevoAp = APELLIDOS_PROTEGIDO[Math.floor(Math.random()*APELLIDOS_PROTEGIDO.length)];
      j.padreMadre.nombre = `${j.padreMadre.apodo} ${nuevoAp}`;
    }
  }
  if(j.historialTemporadas){
    j.historialTemporadas.forEach(h=>{ if(h.carino === undefined) h.carino = j.carinoAficion; });
  }
  const TECHOS_COMP = { kike:'Segunda RFEF', marcos:'Primera RFEF', nico:'LaLiga2' };
  (j.companeros||[]).forEach(cmp=>{
    if(cmp.categoria === undefined) cmp.categoria = 'Tercera RFEF';
    if(cmp.techo === undefined) cmp.techo = TECHOS_COMP[cmp.id] || 'Segunda RFEF';
    if(cmp.retirado === undefined) cmp.retirado = false;
    if(cmp.nivel === undefined || cmp.nivel > 4) cmp.nivel = Math.max(1, CATEGORIAS.indexOf(cmp.categoria) + 1);
  });
  refrescarApodosCompaneros(j);
  if(j.rival){
    if(j.rival.compartiendoVestuario === undefined) j.rival.compartiendoVestuario = false;
    if(j.rival.temporadasCompartiendo === undefined) j.rival.temporadasCompartiendo = 0;
    if(j.rival.yaCompartioVestuario === undefined) j.rival.yaCompartioVestuario = false;
  }
}

function valorAtributo(j, clave){
  if(clave === 'tecnica') return Math.round((j.atributos.tiro + j.atributos.regate + j.atributos.pase)/3);
  if(clave === 'mental') return j.mentalidad;
  return j.atributos[clave];
}

function clubConMasCarino(j){
  const entradas = (j.trayectoria||[]).map(e => ({ club: e.club, carino: e.carino||0 }));
  if(!entradas.length) return { club: j.club.nombre, carino: j.carinoAficion||0 };
  const ultima = entradas[entradas.length-1];
  if(ultima.club === j.club.nombre) ultima.carino = Math.max(ultima.carino, j.carinoAficion||0);
  return entradas.reduce((mejor, e) => e.carino > mejor.carino ? e : mejor);
}

  if(sueldoAnual < 60000) return { id:'ajustado', nombre:'Ajustado', texto:'Ya tienes tu propio piso, nada lujoso, pero es tuyo.', costeAnual:3000 };

  return { id:'elite', nombre:'Élite', texto:'Villa, coches de lujo, y una vida que ya no se parece en nada a la de tus amigos de infancia.', costeAnual:150000 };
}

function aplicarEfectosServiciosPasivo(j){
  const porPasoDivisor = SECUENCIA_TEMPORADA.length;
  const FAMILIAS_ACTIVIDAD_FISICA = ['prepFisico', 'entrenTecnico']; // se pausan durante la lesión; fisio, nutricionista, etc. siguen (ayudan a recuperarte)
  const cambios = [];
  Object.entries(j.suscripciones||{}).forEach(([familia, nivel])=>{
    if(!nivel) return;
    if(j.lesionSemanas > 0 && FAMILIAS_ACTIVIDAD_FISICA.includes(familia)) return;
    const servicio = TIENDA_SERVICIOS.find(s=>s.familia===familia);
    if(!servicio) return;
    const infoNivel = servicio.niveles.find(n=>n.nivel===nivel);
    if(!infoNivel) return;
    Object.entries(infoNivel.efectoTemporada).forEach(([clave, valorTemporada])=>{
      const esAtributoODerivado = ATRIBUTOS_JUGADOR.includes(clave) || clave==='mental' || clave==='tecnica';
      const porPaso = valorTemporada / porPasoDivisor;
      const valorAplicar = esAtributoODerivado ? porPaso * DIVISOR_PROGRESO : porPaso;
      cambios.push(...aplicarEfectos(j, { [clave]: valorAplicar }));
    });
  });
  return cambios;
}

    if(!servicio || servicio.esPorcentaje) return;

  });

  const infoActual = nivelActual ? servicio.niveles.find(n=>n.nivel===nivelActual) : null;
  const costeActualFamilia = infoActual ? infoActual.costeAnual : 0;
  const infoNuevo = servicio.niveles.find(n=>n.nivel===nuevoNivel);
  const nuevoCoste = infoNuevo ? infoNuevo.costeAnual : 0;

  }

function evaluarPromesas(j){

    if(p.tipo === 'campeon') cumplida = (S.titulosTemporadaActual||[]).length > 0;
    else if(p.tipo === 'titular') cumplida = !!(S.rolTemporada && S.rolTemporada.corto === 'Titular');

      cumplida = !!(S.temporadaResumen && S.temporadaResumen.goles >= 25);

    }
    else if(p.tipo === 'prima_titulo'){

      if(cumplida) montoPagado = p.montoFijo || 0;
    }
    else if(p.tipo === 'prima_ascenso'){
      cumplida = !!(S.temporadaResumen && S.temporadaResumen.ascenso);
      if(cumplida) montoPagado = p.montoFijo || 0;
    }
    else if(p.tipo === 'prima_popularidad'){
      cumplida = j.stats.popularidad >= (p.umbralPopularidad!=null ? p.umbralPopularidad : 60);
      if(cumplida) montoPagado = p.montoFijo || 0;
    }
    else if(p.tipo === 'prima_mvp'){
      cumplida = !!(S.temporadaResumen && S.temporadaResumen.mvp);
      if(cumplida) montoPagado = p.montoFijo || 0;
    }

    if(p.tipo.indexOf('prima_') === 0){

    j.carrera.trofeosIndividuales = (j.carrera.trofeosIndividuales||0) + 1;
  }

  // Balón de Oro: se decide aquí porque necesita la nota y el MVP, ya calculados; si lo ganas, sustituye al titular normal
  let balonDeOroPuesto = null;
  const clubEsEliteParaBalonOro = !j.club.extranjero || LIGAS_ELITE_EXTRANJERO.includes(j.club.pais);
  if(nota >= 9.0 && partidos >= 28 && (pichichi || mvp || campeon) && esMaximaCategoria && clubEsEliteParaBalonOro){
    const probTop3 = Math.min(0.6, (nota - 8.7) * 0.7 + (campeon?0.15:0) + (pichichi?0.1:0));
    if(Math.random() < probTop3){
      balonDeOroPuesto = (Math.random() < 0.35) ? 1 : (Math.random() < 0.5 ? 2 : 3);
    }
  }
  if(balonDeOroPuesto === 1){
    titular = elegirTitular('balon_de_oro', { nombre:j.nombre, club:j.club.nombre, goles, asistencias, partidos, posicion:posicionFinal, titulosNombres:nombresTitulosGanados, tituloNombre:nombresTitulosGanados[0] });
  }

  // Evaluar si se ha cumplido el objetivo marcado por el club, y ajustar la ambición de cara al año que viene
  let objetivoCumplido = null, objetivoTexto = null, objetivoTipo = null;
  const objetivoTmp = { ascenso, campeon, clasificacionEuropea, posicionFinal };
  if(j.club.objetivoActual){
    objetivoTexto = j.club.objetivoActual.texto;
    objetivoTipo = j.club.objetivoActual.tipo;
    objetivoCumplido = evaluarObjetivo(j.club.objetivoActual.tipo, objetivoTmp);
    const maxNivelClub = esClubGrande(j.club.nombre) ? 4 : 3;
    const prestigioClub = PRESTIGIO_CLUB[j.club.nombre] || 2;
    // Los clubes de más entidad no pierden su identidad tras una sola mala temporada: tienen un suelo de ambición
    const sueloAmbicion = esClubGrande(j.club.nombre) ? 3 : (prestigioClub >= 3 ? 2 : 1);
    // Jugar el playoff de ascenso es un buen año aunque no se acabe subiendo: no se penaliza como un objetivo fallido
    const cuentaComoNeutro = objetivoTipo === 'ascenso' && !objetivoCumplido && enPlayoff;
    if(!cuentaComoNeutro){
      j.club.ambicionNivel = Math.max(sueloAmbicion, Math.min(maxNivelClub, (j.club.ambicionNivel||2) + (objetivoCumplido ? 1 : -1)));
    }
    if(objetivoCumplido === false && !cuentaComoNeutro && tier !== 'campeon' && tier !== 'ascenso'){
      const OBJ_FRASE = {
        campeon:'ganar la Liga', europa:'meterse en puestos europeos',
        libertadores:'clasificarse para la Libertadores', concacaf:'clasificarse para la fase continental',
        afc:'clasificarse para la fase continental', consolidar:'firmar una temporada tranquila',
        supervivencia:'asegurar la permanencia'
      };
      const objFrase = OBJ_FRASE[objetivoTipo] || objetivoTexto;
      // ¿se ha quedado cerca? entonces el tono es de "a las puertas", no de "muy lejos"
      let rozado = false;
      if(objetivoTipo === 'campeon') rozado = posicionFinal <= 3;
      else if(objetivoTipo === 'europa' || objetivoTipo === 'libertadores' || objetivoTipo === 'concacaf' || objetivoTipo === 'afc') rozado = !clasificacionEuropea && posicionFinal <= umbralContinental + 3;
      else if(objetivoTipo === 'consolidar') rozado = posicionFinal <= 16;
      const FRASES_OBJETIVO_ROZADO = [
        d => `. Se queda a las puertas de ${d.objetivo}, para rabia de una grada que lo veía hecho.`,
        d => `. Tan cerca de ${d.objetivo} y a la vez tan lejos: el club se queda con la miel en los labios.`,
        d => `. Roza ${d.objetivo} pero no llega: una temporada de sensaciones agridulces.`
      ];
      const FRASES_OBJETIVO_FALLIDO = [
        d => `. La directiva no oculta su malestar: lejos de ${d.objetivo} esta temporada.`,
        d => `. Año de decepción en las oficinas del club, muy lejos de ${d.objetivo}.`,
        d => `. La grada empieza a impacientarse: otra temporada sin acercarse a ${d.objetivo}.`
      ];
      const pool = rozado ? FRASES_OBJETIVO_ROZADO : FRASES_OBJETIVO_FALLIDO;
      titular += pool[Math.floor(Math.random()*pool.length)]({ objetivo: objFrase });
    }
  }

  // Cariño de la afición: sube con el rendimiento, los años de fidelidad y los títulos siendo importante;
  // baja en años flojos y si el club esperaba más de lo conseguido
  j.temporadasEnClub = (j.temporadasEnClub||0) + 1;
  const bonusLealtad = j.temporadasEnClub >= 5 ? 3 : (j.temporadasEnClub >= 3 ? 2 : 0);
  const esJugadorImportante = nota >= 7 || pichichi || mvp;
  const bonusCampeon = campeon ? (esJugadorImportante ? 12 : 6) : 0;
  const penalizacionObjetivo = objetivoCumplido === false ? -4 : 0;
  const cambioCarino = Math.round((nota - 5) * 2.2) + bonusLealtad + (pichichi ? 4 : 0) + bonusCampeon + (!campeon && (ascenso || clasificacionEuropea) ? 3 : 0) + penalizacionObjetivo;
  const carinoRealAplicado = gananciaEscalada(j.carinoAficion||20, cambioCarino, 100);
  j.carinoAficion = Math.max(0, Math.min(100, (j.carinoAficion||20) + carinoRealAplicado));
  j.maxCarinoAlcanzado = Math.max(j.maxCarinoAlcanzado||0, j.carinoAficion);

  const declive = aplicarDeclivePorEdad(j);

  // Once ideal de la temporada (FIFA)
  const enOnceIdeal = nota >= 7.8 && titular && esMaximaCategoria && !j.club.extranjero;

  j.carrera.valorMercadoMaximo = Math.max(j.carrera.valorMercadoMaximo||0, j.stats.valorMercado);
  return { partidos, goles, asistencias, ascenso, campeon, clasificacionEuropea, nivelEuropeo, titular, posicionFinal, crecimientoValor, pichichi, botaOro, mvp, nota, objetivoCumplido, objetivoTexto, objetivoTipo, declive, enOnceIdeal, balonDeOroPuesto, enPlayoff, fasesCompeticiones };
}
function aplicarDeclivePorEdad(j){
  j.atributosEnDeclive = {};
  if(j.edad < 30) return null;
  const cambiosEdad = [];
  const factorEdad = Math.min(4, j.edad - 29); // 1 a los 30, crece cada año hasta un tope
  const declive1Punto = (clave, probabilidad) => {
    if(j.atributos[clave] > 1 && Math.random() < probabilidad){
      j.atributos[clave] -= 1;
      j.atributosEnDeclive[clave] = true;
      cambiosEdad.push({ clave, tipo:'atributo', nuevoValor:j.atributos[clave], subio:false });
      Sonido.bajaNivel();
    }
  };
  declive1Punto('velocidad', Math.min(0.9, factorEdad * 0.22));
  declive1Punto('fisico', Math.min(0.75, factorEdad * 0.16));
  if(j.edad >= 33){
    declive1Punto('regate', Math.min(0.6, factorEdad * 0.13));
  }
  return cambiosEdad.length > 0 ? cambiosEdad : null;
}

function actualizarPosicionLiga(j){
  if(S.posicionLiga===undefined) return;
  const rating = ratingJugador(j);
  const factorJugador = rating >= 14 ? -1 : (rating <= 7 ? 1 : 0);
  const factorForma = j.stats.forma >= 65 ? -1 : (j.stats.forma < 40 ? 1 : 0);
  let tendencia = factorJugador + factorForma; // -2 a +2
  // Cerca de la cima, la competencia es feroz: mantenerse ahí arriba cuesta mucho más que llegar por primera vez
  if(S.posicionLiga <= 2) tendencia = Math.min(tendencia + 2, 2);
  else if(S.posicionLiga <= 5) tendencia = Math.min(tendencia + 1, 2);
  const azar = Math.random();
  let cambio = 0;
  if(tendencia !== 0 && azar < 0.55) cambio = tendencia > 0 ? Math.min(2, tendencia) : Math.max(-2, tendencia);
  else if(azar < 0.85) cambio = (Math.random()<0.5 ? -1 : 1); // variabilidad real, incluso estando arriba del todo
  S.posicionLiga = Math.min(EQUIPOS_EN_LIGA, Math.max(1, S.posicionLiga + cambio));
}

/* ============ LÓGICA DE TIRADAS ============ */
function calcModBono(jugador, tirada){
  let modBono = 0;
  const mods = [];
  if(jugador.stats.salud < 50){ modBono -= 2; mods.push('Salud -2'); }
  if(jugador.stats.forma < 40){ modBono -= 1; mods.push('Forma -1'); }
  if(tirada.atributo === 'mental' && jugador.stats.confianza < 35){ modBono -= 2; mods.push('Confianza -2'); }
  return { modBono, mods };
}
function probabilidadExito(jugador, tirada, bonoExtra){
  bonoExtra = bonoExtra || 0;
  const penalizacionRachaGafada = jugador.rachaGafada ? -3 : 0;
  const penalizacionCrisis = jugador.estadoMental === 'crisis' ? -2 : 0;
  const bonoAtributo = Math.round(valorAtributo(jugador, tirada.atributo)/3) + bonoExtra + penalizacionRachaGafada + penalizacionCrisis;
  const { modBono, mods } = calcModBono(jugador, tirada);
  if(jugador.rachaGafada) mods.push('Racha gafada -3');
  const bono = bonoAtributo + modBono;
  const dificultad = tirada.dificultadBase;
  let exitos = 0;
  for(let d=1; d<=20; d++){
    if(d===1) continue; // un 1 natural siempre falla
    if(d===20){ exitos++; continue; } // un 20 natural siempre acierta
    if(d+bono >= dificultad) exitos++;
  }
  return { pct: Math.round(exitos/20*100), bono, bonoAtributo, dificultad, mods };
}
function etiquetaProbabilidad(pct){
  const p = Math.round(pct);
  if(p <= 0)  return `Imposible (${p}%)`;
  if(p <= 10) return `Casi imposible (${p}%)`;
  if(p <= 25) return `Muy difícil (${p}%)`;
  if(p <= 40) return `Difícil (${p}%)`;
  if(p <= 55) return `Incierto (${p}%)`;
  if(p <= 70) return `Favorable (${p}%)`;
  if(p <= 85) return `Probable (${p}%)`;
  if(p <= 95) return `Muy probable (${p}%)`;
  return `Seguro (${p}%)`;
}
function tirar(jugador, tirada, bonoExtra, ventaja){
  bonoExtra = bonoExtra || 0;
  const penalizacion = jugador.rachaGafada ? -3 : 0;
  if(jugador.rachaGafada) jugador.rachaGafada = false;
  const penalizacionCrisis = jugador.estadoMental === 'crisis' ? -2 : 0;
  let dado = 1 + Math.floor(Math.random()*20);
  let dadoDescartado = null;
  if(ventaja){
    const dado2 = 1 + Math.floor(Math.random()*20);
    if(dado2 > dado){ dadoDescartado = dado; dado = dado2; } else { dadoDescartado = dado2; }
  }
  const bonoAtributo = Math.round(valorAtributo(jugador, tirada.atributo)/3) + bonoExtra + penalizacion + penalizacionCrisis;
  const { modBono, mods } = calcModBono(jugador, tirada);
  const bono = bonoAtributo + modBono;
  const dificultad = tirada.dificultadBase;
  const total = dado + bono;
  const exito = dado===1 ? false : (dado===20 ? true : total>=dificultad); // un 1 natural siempre falla y un 20 natural siempre acierta, pase lo que pase con el bono
  return { dado, dadoDescartado, bono, bonoAtributo, modBono, mods, dificultad, total, exito, natural20: dado===20, natural1: dado===1, tuvoRachaGafada: penalizacion<0 };
}
function actualizarRachaResultados(j, r){
  if(!r) return;
  if(j.estadoMental === 'racha' && r.exito === false){
    j.estadoMental = 'normal';
    j.rachaResultados = 0;
    return;
  }
  if(r.natural20) j.rachaResultados = Math.min(5, (j.rachaResultados||0) + 1);
  else if(r.natural1) j.rachaResultados = Math.max(-5, (j.rachaResultados||0) - 1);
  else return;
  if(j.estadoMental === 'crisis') return; // la crisis no se resuelve sola, solo con una decisión activa
  if(j.rachaResultados <= -4){
    j.estadoMental = 'crisis';
    j.rachaResultados = 0;
    aplicarEfectos(j, {confianza:-15});
  } else if(j.rachaResultados >= 4){
    j.estadoMental = 'racha';
    j.rachaResultados = 0;
  }
}
function salirDeCrisis(j, metodo){
  if(j.estadoMental !== 'crisis') return;
  j.estadoMental = 'normal';
  j.rachaResultados = 0;
  if(metodo === 'psicologo'){
    aplicarEfectos(j, {confianza:10});
  } else if(metodo === 'descanso'){
    aplicarEfectos(j, {confianza:6});
    S.rolTemporada = S.rolTemporada || {};
    S.rolTemporada.fraccion = Math.max(0.4, (S.rolTemporada.fraccion||0.85) - 0.08);
  } else if(metodo === 'capitan'){
    aplicarEfectos(j, {confianza:8, vestuario:5});
  }
}
function factorResistenciaAtributo(valorActual){
  if(valorActual <= 8) return 1;
  return Math.max(0.08, 1 - (valorActual-8)/12*0.92);
}
function acumularProgresoAtributo(jugador, clave, valorCrudo, cambios){
  let delta = valorCrudo / DIVISOR_PROGRESO;
  if(clave === 'mental'){
    if(delta > 0) delta *= factorResistenciaAtributo(jugador.mentalidad);
    if(delta > 0 && jugador.mentalidad >= ATRIBUTO_MAX) delta = 0; // ya al máximo, no sigue acumulando de más
    jugador.mentalidadProgreso = (jugador.mentalidadProgreso||0) + delta;
    while(jugador.mentalidadProgreso >= 1 && jugador.mentalidad < ATRIBUTO_MAX){
      jugador.mentalidadProgreso -= 1; jugador.mentalidad += 1;
      cambios.push({ clave:'mental', tipo:'atributo', nuevoValor:jugador.mentalidad, subio:true });
      Sonido.subeNivel();
      mostrarNotificacion(`${iconoInline('mental',15)}<b style="color:var(--gold);">${NICE_ATTR.mental} +1</b>`, 'atributo');
    }
    if(jugador.mentalidad >= ATRIBUTO_MAX) jugador.mentalidadProgreso = Math.min(jugador.mentalidadProgreso, 0);
    while(jugador.mentalidadProgreso <= -1 && jugador.mentalidad > 1){
      jugador.mentalidadProgreso += 1; jugador.mentalidad -= 1;
      cambios.push({ clave:'mental', tipo:'atributo', nuevoValor:jugador.mentalidad, subio:false });
      Sonido.bajaNivel();
    }
    return;
  }
  if(delta > 0) delta *= factorResistenciaAtributo(jugador.atributos[clave]);
  if(delta > 0 && jugador.atributos[clave] >= ATRIBUTO_MAX) delta = 0; // ya al máximo, no sigue acumulando de más
  jugador.atributosProgreso[clave] = (jugador.atributosProgreso[clave]||0) + delta;
  while(jugador.atributosProgreso[clave] >= 1 && jugador.atributos[clave] < ATRIBUTO_MAX){
    jugador.atributosProgreso[clave] -= 1; jugador.atributos[clave] += 1;
    cambios.push({ clave, tipo:'atributo', nuevoValor:jugador.atributos[clave], subio:true });
    Sonido.subeNivel();
    mostrarNotificacion(`${iconoInline(clave,15)}<b style="color:var(--gold);">${NICE_ATTR[clave]||clave} +1</b>`, 'atributo');
  }
  if(jugador.atributos[clave] >= ATRIBUTO_MAX) jugador.atributosProgreso[clave] = Math.min(jugador.atributosProgreso[clave], 0);
  while(jugador.atributosProgreso[clave] <= -1 && jugador.atributos[clave] > 1){
    jugador.atributosProgreso[clave] += 1; jugador.atributos[clave] -= 1;
    cambios.push({ clave, tipo:'atributo', nuevoValor:jugador.atributos[clave], subio:false });
    Sonido.bajaNivel();
  }
}
function gananciaEscalada(valorActual, delta, tope){
  tope = tope || 100;
  if(delta <= 0) return delta; // las bajadas no se ven afectadas, solo cuesta más subir
  const progreso = Math.min(1, Math.max(0, valorActual/tope));
  const factor = 1 - progreso*0.65; // cerca de 0 -> ganancia completa, cerca del tope -> hasta un 65% menos
  const real = delta * factor;
  return real >= 1 ? Math.round(real) : (Math.random() < real ? 1 : 0); // efectos pequeños no se pierden del todo, solo se vuelven menos fiables
}
function formatearDuracionLesion(semanas){
  if(semanas >= 8){
    const meses = Math.round(semanas / 4.33);
    return `${meses} ${meses===1?'mes':'meses'}`;
  }
  return `${semanas} ${semanas===1?'semana':'semanas'}`;
}
function generarLesion(j){
  const dado = 1 + Math.floor(Math.random()*20);
  const bonoFisico = Math.round(j.atributos.fisico/4);
  const total = dado===1 ? 0 : dado + bonoFisico; // un 1 natural es siempre grave, el físico no lo evita
  let ventanas, gravedad;
  if(total <= 5){ ventanas=6; gravedad='muy grave'; }
  else if(total <= 9){ ventanas=4; gravedad='grave'; }
  else if(total <= 13){ ventanas=2; gravedad='moderada'; }
  else if(total <= 17){ ventanas=1; gravedad='leve'; }
  else { ventanas=0; gravedad='un susto sin más'; }
  const semanas = ventanas * SEMANAS_POR_PASO;
  if(semanas > 0){
    S.temporadaSemanasLesion = (S.temporadaSemanasLesion||0) + semanas;
    j.lesionSemanas = (j.lesionSemanas||0) + semanas;
  }
  return { dado, bonoFisico, total, ventanas, gravedad, semanas };
}
function aplicarEfectos(jugador, efectos){
  const cambios = [];
  const RALENTIZACION_FAMA = 0.6; // reputación y popularidad suben más despacio en general, no solo cerca del tope
  Object.entries(efectos||{}).forEach(([k,v])=>{
    if(jugador.stats[k]!==undefined){
      const tope = STATS_CON_TOPE_100.includes(k) ? 100 : Infinity;
      let factorAjuste = (v>0 && (k==='reputacion' || k==='popularidad')) ? RALENTIZACION_FAMA : 1;
      if(v>0 && k==='popularidad'){
        // un jugador desconocido no se hace popular de la noche a la mañana: cuesta mucho más al principio
        const factorInicio = Math.min(1, 0.25 + (jugador.stats.popularidad||0)/40);
        factorAjuste *= factorInicio;
      }
      const vAjustado = factorAjuste !== 1 ? (STATS_CON_TOPE_100.includes(k) ? v*factorAjuste : Math.round(v*factorAjuste)) : v;
      const deltaReal = STATS_CON_TOPE_100.includes(k) ? gananciaEscalada(jugador.stats[k], vAjustado, 100) : vAjustado;
      jugador.stats[k] = Math.min(tope, Math.max(0, jugador.stats[k]+deltaReal));
      cambios.push({ clave:k, tipo:'stat', delta:deltaReal });
    }
    else if(k==='mental'){
      acumularProgresoAtributo(jugador, 'mental', v, cambios);
    }
    else if(k==='carinoAficion'){
      const deltaReal = gananciaEscalada(jugador.carinoAficion||0, v, 100);
      jugador.carinoAficion = Math.min(100, Math.max(0, (jugador.carinoAficion||0)+deltaReal));
      cambios.push({ clave:k, tipo:'stat', delta:deltaReal });
    }
    else if(k==='tecnica'){
      ['tiro','regate','pase'].forEach(sub=> acumularProgresoAtributo(jugador, sub, v/3, cambios));
    }
    else if(jugador.atributos[k]!==undefined){
      acumularProgresoAtributo(jugador, k, v, cambios);
    }
  });
  return cambios;
}

/* ============ SELECCIÓN DE EVENTOS (con cooldown) ============ */
function vistoReciente(jugador, ev){
  const registros = jugador.eventosVistos.filter(v=>v.id===ev.id);
  if(registros.length===0) return false;
  if(ev.unico) return true;
  const cooldown = ev.cooldown ?? 2;
  const ultima = Math.max(...registros.map(v=>v.temporada));
  return (S.temporada - ultima) < cooldown;
}
function elegirEvento(jugador){
  const trasTitulo = !!S.ultimoEventoFueTitulo;
  S.ultimoEventoFueTitulo = false;
  if(trasTitulo){
    const evCelebracion = BANCO_EVENTOS.find(e=>e.id==='celebracion_titulo');
    if(evCelebracion) return evCelebracion;
  }
  const candidatos = BANCO_EVENTOS.filter(ev=>{
    if(ev.soloTrasTitulo) return false; // solo se dispara justo después de un título, nunca por el pool normal
    if(vistoReciente(jugador, ev)) return false;
    if(ev.soloSiSano && jugador.lesionSemanas > 0) return false;
    if(ev.soloSiLesionado && jugador.lesionSemanas <= 0) return false;
    if(ev.evitarTrasTitulo && trasTitulo) return false;
    if(ev.trigger.edadMin && jugador.edad < ev.trigger.edadMin) return false;
    if(ev.trigger.edadMax && jugador.edad > ev.trigger.edadMax) return false;
    if(ev.trigger.condicion && !ev.trigger.condicion(jugador)) return false;
    return Math.random() < ev.trigger.probabilidad;
  });
  if(candidatos.length===0) return EVENTO_RELLENO;
  return candidatos[Math.floor(Math.random()*candidatos.length)];
}
function registrarEvento(jugador, ev){
  if(ev && ev.id) jugador.eventosVistos.push({ id: ev.id, temporada: S.temporada });
  S._amigoBoda = null;
  S._periodistaCandidata = null;
  S._amigoNoFutbolCandidato = null;
  S._hermanoCandidato = null;
  S._padreMadreCandidato = null;
  S._mentorCandidato = null;
  S._amigoAyuda = null;
}

/* ============ AVANCE DE LA TEMPORADA ============ */
function decaerForma(j){
  const base = 55;
  j.stats.forma = Math.round(j.stats.forma + (base - j.stats.forma) * 0.05);
  j.stats.confianza = Math.round(j.stats.confianza + (base - j.stats.confianza) * 0.05);
}
function zonaPlayoff(categoria){
  return categoria === "LaLiga2" ? [3,6] : [2,5];
}
function procesarFinTemporada(j, ascensoPlayoff){
  if(j.rival && j.rival.compartiendoVestuario){
    j.rival.temporadasCompartiendo = (j.rival.temporadasCompartiendo || 0) + 1;
  }
  evolucionarRival(j);
  evolucionarProtegido(j);
  evolucionarCompaneros(j);
  S.temporadaResumen = calcularResumenTemporada(j, ascensoPlayoff);
  if(S.temporadaResumen.campeon){
    S.titulosTemporadaActual = S.titulosTemporadaActual || [];
    S.titulosTemporadaActual.push(j.club.extranjero ? j.club.liga : (j.club.categoria === "LaLiga" ? "LaLiga" : TIER_CATEGORIA[j.club.categoria]));
  }
  S.resultadoPromesas = evaluarPromesas(j);
  if(S.resultadoPromesas && S.resultadoPromesas.length){
    let ajustePromesas = 0;
    S.resultadoPromesas.forEach(res=>{ ajustePromesas += res.cumplida ? 0.3 : -0.3; });
    S.temporadaResumen.nota = Math.max(1, Math.min(10, Math.round((S.temporadaResumen.nota + ajustePromesas)*10)/10));
    j.ultimaNotaTemporada = S.temporadaResumen.nota;
  }
  j.carrera.partidos += S.temporadaResumen.partidos;
  j.carrera.goles += S.temporadaResumen.goles;
  j.carrera.asistencias += S.temporadaResumen.asistencias;
  j.historialTemporadas = j.historialTemporadas || [];
  j.historialTemporadas.push({
    temporada: S.temporada, club: j.club.nombre, categoria: j.club.categoria, liga: j.club.liga || null,
    pais: j.club.extranjero ? j.club.pais : 'España', extranjero: !!j.club.extranjero,
    partidos: S.temporadaResumen.partidos, goles: S.temporadaResumen.goles, asistencias: S.temporadaResumen.asistencias,

  });
  if((S.titulosTemporadaActual||[]).length > 0){

  }
  const nivelVidaFinTemporada = nivelDeVida(j.contrato.sueldoAnual);
  if(nivelVidaFinTemporada.id==='alto' || nivelVidaFinTemporada.id==='elite'){
    aplicarEfectos(j, {popularidad:3}); // vivir a lo grande también da más exposición mediática
  }
