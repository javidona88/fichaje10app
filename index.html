function unirNombres(arr){
  const nombres = arr.map(c => c.apodo || c.nombre);
  if(nombres.length <= 1) return nombres.join('');
  return nombres.slice(0,-1).join(', ') + ' y ' + nombres[nombres.length-1];
}
function resumenSubtramas(j){
  const items = [];

  const R = j.rival;
  if(R && R.trayectoriaIniciada){
    const mis = (j.carrera.titulos||0) + (j.titulosSeleccion||[]).length;
    const sus = R.titulos||0;
    const misBO = j.carrera.balonesDeOro||0;
    const susBO = R.balonesDeOro||0;
    let comparativa;
    if(mis > sus) comparativa = `Cerraste tu carrera con más títulos que él, ${mis} a ${sus}.`;
    else if(mis < sus) comparativa = `Él levantó más trofeos que tú, ${sus} a ${mis}, y eso siempre escoció un poco.`;
    else comparativa = `Acabasteis igualados en palmarés, ${mis} ${mis===1?'título':'títulos'} cada uno.`;
    if(susBO > misBO && misBO === 0) comparativa += ` Además se llevó ${susBO} ${susBO===1?'Balón de Oro':'Balones de Oro'} que a ti se te resistieron.`;
    else if(susBO > misBO) comparativa += ` En Balones de Oro también te sacó ventaja, ${susBO} a ${misBO}.`;
    else if(misBO > 0 && misBO > susBO) comparativa += ` El Balón de Oro, en cambio, acabó siendo cosa tuya.`;
    const tier = tierRelacionRival(R.relacion);
    const intro = tier === 'reconciliacion'
      ? `Lo que empezó como una rivalidad de patio de colegio con ${R.apodo} terminó en respeto, casi en amistad.`
      : tier === 'toxica'
        ? `Nunca hicisteis las paces. ${R.apodo} fue tu vara de medir durante toda la carrera, para lo bueno y para lo malo.`
        : `${R.apodo} fue el rival de siempre: el que te obligó a exigirte más, sin necesidad de odiarse.`;
    const vestuario = (R.yaCompartioVestuario || R.compartiendoVestuario)
      ? ` Llegasteis incluso a compartir vestuario, peleando por el mismo puesto, hasta que el club tuvo que quedarse con uno de los dos.`
      : '';
    items.push({ titulo:`Tu rival, ${R.apodo}`, texto:`${intro}${vestuario} ${comparativa}` });
  }

  if(j.mentor){
    const rel = j.mentor.relacion||0;
    const t = rel >= 60
      ? `${j.mentor.apodo}, el veterano que te acogió en tu primer vestuario, acabó siendo un amigo para toda la vida. Nunca te dejó olvidar de dónde venías.`
      : rel >= 30
        ? `${j.mentor.apodo} te enseñó el oficio cuando eras un crío. Con los años os fuisteis perdiendo la pista, pero aquellos consejos siguen contigo.`
        : `La relación con ${j.mentor.apodo}, tu primer mentor, se enfrió con el tiempo. Cosas del fútbol.`;
    items.push({ titulo:`Tu mentor, ${j.mentor.apodo}`, texto:t });
  }

  if(j.protegido){
    const P = j.protegido;
    let t;
    if((P.relacion||0) < 0) t = `Lo que empezó como una tutoría acabó torcido: ${P.apodo} y tú terminasteis sin hablaros.`;
    else if(P.nivel >= 4) t = `${P.apodo}, aquel chaval al que apadrinaste, llegó a lo más alto. Y en cada entrevista seguía diciendo quién le había abierto la puerta.`;
    else if(P.nivel === 3) t = `${P.apodo} se hizo un sitio en el fútbol profesional. Ver crecer a alguien a quien ayudaste compensa muchas malas tardes.`;
    else t = `${P.apodo} no llegó tan lejos como soñabais, pero le diste una oportunidad que nadie más le quiso dar.`;
    items.push({ titulo:`Tu protegido, ${P.apodo}`, texto:t });
  }

  if(j.tienePareja && j.pareja){
    const f = j.stats.felicidadPareja||0;
    const t = f >= 60
      ? `Te retiras con ${j.pareja.apodo} al lado, la misma persona que aguantó los viajes, las lesiones y las noches de hotel. La mejor decisión que tomaste lejos del campo.`
      : f >= 30
        ? `Sigues junto a ${j.pareja.apodo}, aunque el fútbol os puso a prueba más de una vez.`
        : `Llegas al final de tu carrera con ${j.pareja.apodo}, en una relación que ha sobrevivido a base de paciencia por ambas partes.`;
    items.push({ titulo:'Tu pareja', texto:t });
  }

  if(j.hijo){
    const interes = j.hijo.interesFutbol||0;
    const parentesco = j.hijo.genero === 'f' ? 'hija' : 'hijo';
    const t = interes >= 60
      ? `${j.hijo.nombre} creció viéndote jugar y ya sueña con dedicarse a esto. Quizá la historia se repita.`
      : `${j.hijo.nombre} nació en mitad de todo esto y te obligó a recordar que hay vida más allá del césped.`;
    items.push({ titulo:`Tu ${parentesco}, ${j.hijo.nombre}`, texto:t });
  }

  if(j.hermano){
    const parentesco = j.hermano.genero === 'f' ? 'hermana' : 'hermano';
    const rel = j.hermano.relacion||0;
    const interes = j.hermano.interesFutbol||0;
    const t = (interes >= 50 && rel >= 60)
      ? `Tu ${parentesco} ${j.hermano.apodo} también se lanzó al fútbol, con tu nombre como referencia y no como sombra. Os apoyasteis hasta el final.`
      : rel >= 60
        ? `Tu ${parentesco} ${j.hermano.apodo} fue tu hincha número uno desde la grada, temporada tras temporada.`
        : `La relación con tu ${parentesco} ${j.hermano.apodo} tuvo altibajos, como todas las de verdad.`;
    items.push({ titulo:`Tu ${parentesco}, ${j.hermano.apodo}`, texto:t });
  }

  if(j.padreMadre){
    const parentesco = j.padreMadre.genero === 'f' ? 'madre' : 'padre';
    const rel = j.padreMadre.relacion||0;
    const t = j.padreMadre.tipo === 'apoyo'
      ? `${j.padreMadre.apodo} estuvo en la grada desde los partidos de alevines. Ese primer empujón lo cambió todo.`
      : rel >= 60
        ? `${j.padreMadre.apodo}, que al principio no veía claro que te dedicaras a esto, acabó siendo quien más fiero te defendía.`
        : `Con ${j.padreMadre.apodo} nunca terminó de haber un acuerdo del todo sobre el camino que elegiste.`;
    items.push({ titulo:`Tu ${parentesco}, ${j.padreMadre.apodo}`, texto:t });
  }

  if(j.periodista){
    items.push({ titulo:`${j.periodista.apodo}, la periodista de tu carrera`, texto:`${j.periodista.apodo} contó tu historia mejor que nadie, desde la primera entrevista en un campo de tierra hasta la última rueda de prensa. La voz que puso palabras a tu camino.` });
  }

  if(j.amigoNoFutbol){
    const A = j.amigoNoFutbol;
    items.push({ titulo:`${A.apodo}, tu amig${A.genero==='f'?'a':'o'} de siempre`, texto:`${A.apodo}, ${A.profesion}, te mantuvo con los pies en el suelo cuando el mundo del fútbol tiraba de ti hacia otro lado. ${A.genero==='f'?'La amiga':'El amigo'} de antes de todo esto.` });
  }

  const comp = j.companeros || [];
  if(comp.length){
    const cercanos = comp.filter(c => (c.relacion||0) >= 60);
    let t;
    if(cercanos.length === comp.length) t = `Mantuviste la amistad con ${unirNombres(comp)} hasta el final. Los que estaban antes de que fueras nadie, siguen ahí.`;
    else if(cercanos.length) t = `De la vieja pandilla de la cantera conservaste a ${unirNombres(cercanos)}. Con ${unirNombres(comp.filter(c => (c.relacion||0) < 60))} el contacto se fue perdiendo.`;
    else t = `Del grupo de la cantera, cada uno acabó tirando por su lado. El fútbol une, pero también dispersa.`;
    items.push({ titulo:'Los amigos de la cantera', texto:t });
  }

  return items;
}

SCREENS.final = function(){
  const j = S.jugador;
  topbar("Fin de la carrera");
  const press = el('div','press');
  const ph = el('div','press-header');
  ph.appendChild(crearEyebrow('Retiro'));
  ph.appendChild(el('h2',null,'Resumen de carrera'));
  press.appendChild(ph);
  press.appendChild(el('div','press-headline', `${capitalizarNombre(j.nombre)} cuelga las botas tras ${S.temporada} temporadas`));
  const pb = el('div','press-body');
  const valorMaximoReal = Math.max(j.carrera.valorMercadoMaximo||0, j.stats.valorMercado);
  const dineroGanadoReal = Math.max(j.carrera.dineroGanado||0, j.stats.dinero);
  pb.appendChild(el('p',null,`Se retira con ${j.edad} años, habiendo llegado hasta ${categoriaCorta(j.club)}, con un valor de mercado máximo de ${formatearDinero(valorMaximoReal)} en su mejor momento. En toda su carrera ganó ${formatearDinero(dineroGanadoReal)}, de los que le quedan ${formatearDinero(j.stats.dinero)} ahorrados.`));

  const historial = j.historialTemporadas || [];
  const mejorTemporada = historial.filter(h=>h.nota!=null).sort((a,b)=>b.nota-a.nota)[0];
  if(mejorTemporada){
    pb.appendChild(el('p',null,`Su mejor temporada llegó en ${temporadaAAno(mejorTemporada.temporada)} con ${mejorTemporada.club} (${mejorTemporada.edad} años): nota media de ${formatearNumero(mejorTemporada.nota)}, con ${mejorTemporada.goles} goles y ${mejorTemporada.asistencias} asistencias.`));
  }

  pb.appendChild(el('div','reveal-section-title','La carrera en números'));

  const golesPorPartido = j.carrera.partidos > 0 ? (j.carrera.goles / j.carrera.partidos).toFixed(2) : '0.00';
  const numClubes = (j.trayectoria||[]).length || 1;
  const notasValidas = historial.filter(h=>h.nota!=null).map(h=>h.nota);
  const notaMediaCarrera = notasValidas.length ? (notasValidas.reduce((s,n)=>s+n,0)/notasValidas.length).toFixed(2) : '—';
  const titulosClub = j.carrera.titulos||0;
  const titulosSel = (j.titulosSeleccion||[]).length;

  const hero = el('div','press-stats-hero');
  [
    [j.carrera.goles, 'Goles'],
    [j.carrera.partidos, 'Partidos'],
    [j.carrera.asistencias, 'Asistencias']
  ].forEach(([num,lbl])=>{
    const s = el('div','press-stat-hero');
    s.appendChild(el('div','num', num));
    s.appendChild(el('div','lbl', lbl));
    hero.appendChild(s);
  });
  pb.appendChild(hero);

  [
    { titulo:'En el campo', icono:'tiro', items:[
      ['Goles/partido', golesPorPartido, false],
      ['Nota media', notaMediaCarrera, false],
      ['Mejor nota', mejorTemporada ? formatearNumero(mejorTemporada.nota) : '—', false]
    ]},
    { titulo:'Palmarés', icono:'trofeo', items:[
      ['Ligas / copas', titulosClub, true],
      ['Con la selección', titulosSel, true],
      ['Ascensos', j.carrera.ascensos||0, true]
    ]},
    { titulo:'Distinciones', icono:'estrella', items:[
      ['Balones de Oro', j.carrera.balonesDeOro||0, true],
      ['Pichichis / MVP', j.carrera.trofeosIndividuales||0, true],
      ['Cariño máximo', `${j.maxCarinoAlcanzado||0}`, false]
    ]},
    { titulo:'Recorrido', icono:'calendario', items:[
      ['Temporadas', S.temporada, false],
      ['Clubes', numClubes, false],
      ['Retirada', `${j.edad} años`, false]
    ]}
  ].forEach(g=>{
    const wrap = el('div','press-stat-group');
    const tit = el('div','grp-tit');
    tit.innerHTML = `${iconoInline(g.icono,13)}${g.titulo}`;
    wrap.appendChild(tit);
    const grid = el('div','press-stat-grid');
    g.items.forEach(([lbl,num,esLogro])=>{
      const cero = esLogro && (num === 0 || num === '0');
      const s = el('div', 'press-stat' + (esLogro && !cero ? ' gold' : '') + (cero ? ' dim' : ''));
      s.appendChild(el('div','num', num));
      s.appendChild(el('div','lbl', lbl));
      grid.appendChild(s);
    });
    wrap.appendChild(grid);
    pb.appendChild(wrap);
  });
  if(j.tuvoPrimeraConvocatoriaAbsoluta || j.tuvoPrimeraConvocatoriaSub21){
    const textoSeleccion = j.tuvoPrimeraConvocatoriaAbsoluta ? 'Llegó a debutar con la selección absoluta.' : 'Llegó a debutar con la selección Sub-21.';
    pb.appendChild(el('p',null,textoSeleccion));
  }
  const mejorEtapaCarinoFinal = clubConMasCarino(j);
  if(mejorEtapaCarinoFinal.carino >= 80){
    pb.appendChild(el('div','badge token', `${iconoInline('estrella',12)}Leyenda ${articuloClub(mejorEtapaCarinoFinal.club)==='la'?'de la':'del'} ${mejorEtapaCarinoFinal.club}: la afición nunca olvidará tu nombre`));
  } else if(mejorEtapaCarinoFinal.carino >= 60){
    pb.appendChild(el('div','badge', `❤️ Jugador querido en ${articuloClub(mejorEtapaCarinoFinal.club)} ${mejorEtapaCarinoFinal.club}`));
  }
  const btnCompartir = document.createElement('button');
  btnCompartir.className = 'btn-main';
  btnCompartir.style.marginTop = '16px';
  btnCompartir.textContent = 'Descargar resumen como imagen ⬇';
  btnCompartir.onclick = ()=>{
    try{
      const canvas = generarImagenResumenCarrera(j);
      const link = document.createElement('a');
      link.download = `fichaje10-${j.nombre.replace(/\s+/g,'-')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }catch(e){}
  };
  pb.appendChild(btnCompartir);
  press.appendChild(pb);
  app.appendChild(press);

  if(j.trayectoria && j.trayectoria.length){
    const hc = el('div','card');
    hc.appendChild(crearEyebrow('Trayectoria profesional'));
    let totalTitulos = 0;
    j.trayectoria.forEach(etapa=>{
      const row = el('div','club-row');
      const top = el('div','club-top');
      const escudo = el('div','club-escudo');
      escudo.innerHTML = escudoSVG(etapa.club, 30, etapa.colores);
      top.appendChild(escudo);
      const info = el('div','club-info');
      info.appendChild(el('div','club-nombre', etapa.club));
      info.appendChild(el('div','club-meta', `${banderaPais(etapa.pais)} ${categoriaCorta(etapa)} · ${rangoTemporadas(etapa.temporadaInicio, etapa.temporadaFin)}`));
      top.appendChild(info);
      const statsBox = el('div','club-stats');
      [[etapa.partidos,'PJ'],[etapa.goles,'Goles'],[etapa.asistencias,'Asist.'],[etapa.carino,'Cariño']].forEach(([num,lbl])=>{
        const st = el('div','stat');
        st.appendChild(el('b',null,num));
        st.appendChild(el('span',null,lbl));
        statsBox.appendChild(st);
      });
      top.appendChild(statsBox);
      row.appendChild(top);
      if(etapa.titulos && etapa.titulos.length){
        totalTitulos += etapa.titulos.length;
        const grupos = {};
        etapa.titulos.forEach(t=>{
          grupos[t.nombre] = grupos[t.nombre] || [];
          grupos[t.nombre].push(temporadaAAno(t.temporada));
        });
        const tituloBox = el('div','club-titulos-box');
        Object.entries(grupos).forEach(([nombre,anios])=>{
          const chip = el('span','titulo-chip');
          chip.innerHTML = `${logoCompeticion(nombre,16)} ${nombre} (${anios.join(', ')})`;
          tituloBox.appendChild(chip);
        });
        row.appendChild(tituloBox);
      }
      hc.appendChild(row);
    });
    if((j.temporadasSinEquipo||[]).length){
      const anios = [...new Set(j.temporadasSinEquipo.map(t=>temporadaAAno(t)))].join(', ');
      const rowParo = el('div','club-row');
      const infoParo = el('div','club-info');
      infoParo.appendChild(el('div','club-nombre', 'Sin equipo'));
      infoParo.appendChild(el('div','club-meta', `${j.temporadasSinEquipo.length === 1 ? 'Temporada' : 'Temporadas'} como agente libre · ${anios}`));
      rowParo.appendChild(infoParo);
      hc.appendChild(rowParo);
    }
    if((j.historialSeleccion||[]).length || (j.titulosSeleccion||[]).length){
      totalTitulos += (j.titulosSeleccion||[]).length;
      const rowSel = el('div','club-row');
      const topSel = el('div','club-top');
      const infoSel = el('div','club-info');
      infoSel.appendChild(el('div','club-nombre', `Selección española ${banderaPais('España')}`));
      const nInt = (j.historialSeleccion||[]).length;
      if(nInt) infoSel.appendChild(el('div','club-meta', `${nInt} ${nInt===1?'gran torneo':'grandes torneos'} disputado${nInt===1?'':'s'}`));
      topSel.appendChild(infoSel);
      if((j.carrera.partidosSeleccion||0) > 0){
        const statsSel = el('div','club-stats');
        [[j.carrera.partidosSeleccion||0,'PJ'],[j.carrera.golesSeleccion||0,'Goles'],[j.carrera.asistenciasSeleccion||0,'Asist.'],[(j.titulosSeleccion||[]).length,'Títulos']].forEach(([num,lbl])=>{
          const st = el('div','stat');
          st.appendChild(el('b',null,num));
          st.appendChild(el('span',null,lbl));
          statsSel.appendChild(st);
        });
        topSel.appendChild(statsSel);
      }
      rowSel.appendChild(topSel);
      if((j.titulosSeleccion||[]).length){
        const gruposSel = {};
        j.titulosSeleccion.forEach(t=>{
          gruposSel[t.nombre] = gruposSel[t.nombre] || [];
          gruposSel[t.nombre].push(temporadaAAnoUnico(t.temporada));
        });
        const tituloBoxSel = el('div','club-titulos-box');
        Object.entries(gruposSel).forEach(([nombre,anios])=>{
          const chip = el('span','titulo-chip');
          chip.innerHTML = `${logoCompeticion(nombre,16)} ${nombre} (${anios.join(', ')})`;
          tituloBoxSel.appendChild(chip);
        });
        rowSel.appendChild(tituloBoxSel);
      }
      hc.appendChild(rowSel);
    }
    const totalPartidos = j.trayectoria.reduce((s,e)=>s+e.partidos,0);
    const totalGoles = j.trayectoria.reduce((s,e)=>s+e.goles,0);
    const totalAsist = j.trayectoria.reduce((s,e)=>s+e.asistencias,0);
    const resumenTotal = el('div','resumen-total');
    [[totalPartidos,'Partidos'],[totalGoles,'Goles'],[totalAsist,'Asistencias'],[totalTitulos,'Títulos'],[j.trayectoria.length,'Clubes']].forEach(([num,lbl])=>{
      const st = el('div','stat');
      st.appendChild(el('b',null,num));
      st.appendChild(el('span',null,lbl));
      resumenTotal.appendChild(st);
    });
    hc.appendChild(resumenTotal);
    app.appendChild(hc);
  }

  const subtramas = resumenSubtramas(j);
  const sc = el('div','card');
  sc.appendChild(crearEyebrow('Más allá del fútbol'));
  sc.appendChild(el('h2', null, 'El legado personal'));
  if(subtramas.length){
    sc.appendChild(el('p', null, `<span style="color:var(--ink-soft);font-size:12.5px;">Lo que ${capitalizarNombre(j.nombre)} se lleva de todos estos años, además de lo que pone en la vitrina.</span>`));
    const lista = el('div','legado-personal');
    subtramas.forEach(it=>{
      const row = el('div','legado-item');
      row.appendChild(el('div','legado-tit', it.titulo));
      row.appendChild(el('div','legado-txt', it.texto));
      lista.appendChild(row);
    });
    sc.appendChild(lista);
    sc.appendChild(el('div','legado-cierre', `Nada de esto sale en las estadísticas, pero es la mitad de la historia.`));
  } else {
    sc.appendChild(el('p', null, `<span style="color:var(--ink-soft);font-size:12.5px;">La carrera de ${capitalizarNombre(j.nombre)} fue, sobre todo, la del vestuario y el césped: pocas distracciones, mucho fútbol.</span>`));
  }
  app.appendChild(sc);

  const c = el('div','card');
  const btn = document.createElement('button'); btn.className='btn-main'; btn.textContent='Empezar una nueva carrera';
  btn.onclick = ()=>{ S.screen = 'menu'; S.jugador = null; pintar(); };
  c.appendChild(btn);
  app.appendChild(c);
};

if(S.screen === 'menu' && !S.jugador && !tutorialYaVisto()) S.screen = 'tutorial';
pintar();

if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
